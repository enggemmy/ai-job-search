  /* Single dark theme on purpose: a 3D viewport reads best on a dark ground,

  :root {

    position: absolute; inset: 0; width: 100%; height: 100%;

  }
  @media (max-width: 420px) { .brand span { display: none; } }

  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .ol-row.selected .ol-main svg { color: var(--accent); }
  .ol-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ol-meta { font: 11px var(--mono); color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ol-eye { flex: none; width: 36px; height: 36px; display: grid; place-items: center; border: 0; background: none; cursor: pointer; color: var(--muted); border-radius: 8px; }
  .ol-eye svg { width: 18px; height: 18px; }
  .ol-row.hidden .ol-name, .ol-row.hidden .ol-main svg { opacity: .4; }

  .info { display: grid; gap: 16px; padding: 8px; }
  .thumb { display: flex; gap: 14px; align-items: center; }

  .thumb p { margin: 0; color: var(--muted); font-size: 13px; }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; font: 12.5px/1.5 var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
  .section-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 0 0 6px; }
  .warn { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }

<script>
  // Startup check. If the viewer module fails to load (CDN blocked, offline,
  // or a browser without import maps), say so instead of leaving a dead UI.
  (function () {
    function fail(why) {
      if (window.__blendPocketReady) return;
      var el = document.getElementById('status');
      el.hidden = false;
      el.innerHTML = '<div class="status-card error"><h2>The 3D viewer didn\u2019t start</h2><p></p></div>';
      el.querySelector('p').textContent = why;
    }
    window.addEventListener('error', function (e) {
      var src = e && e.target && (e.target.src || e.target.href);
      if (src && /jsdelivr/.test(src)) fail('Couldn\u2019t download the 3D engine from cdn.jsdelivr.net. Check your connection, or whether your network blocks that site, then reload.');
    }, true);
    if (!(HTMLScriptElement.supports && HTMLScriptElement.supports('importmap'))) {
      fail('This browser is too old for the viewer. Update iOS/Safari (16.4 or newer) or use a current Chrome, then reload.');
    }
    setTimeout(function () { fail('The viewer is taking too long to load. Check your connection and reload. If you are inside an app, try opening this page in Safari or Chrome.'); }, 15000);
  })();
</script>

<script type="module">

const { parseBlend } = (() => {
// blend-parser.js - read-only .blend reader for previewing Blender scenes.
//
// Pure JS, no DOM and no three.js dependency, so it runs in browsers and Node.
// Reads the file's own SDNA (struct catalogue) instead of hard-coding offsets,
// which is what keeps it working across Blender versions.
//
// Scope (preview, not a full importer):
//   - File formats: legacy header (Blender 2.5x-4.x, 32/64-bit, LE/BE) and the
//     Blender 5.0 "large" header; gzip (pre-3.0) and zstd (3.0+) compression.

//     parenting, per-face material slots with the material's viewport colour.
//   - Mesh layouts: MFace (<2.63), MVert/MPoly/MLoop (2.63-3.x) and generic
//     attributes (position / .corner_vert / face offsets, 3.5+).
//   - Embedded file-browser thumbnail and an ID-block inventory.

const TEXT = new TextDecoder('latin1');

const ID_CODES = {
  SC: 'Scenes', OB: 'Objects', ME: 'Meshes', MA: 'Materials', TE: 'Textures',
  IM: 'Images', CA: 'Cameras', LA: 'Lights', WO: 'Worlds', CU: 'Curves',
  CV: 'Curves (hair)', PT: 'Point clouds', VO: 'Volumes', AR: 'Armatures',
  AC: 'Actions', NT: 'Node groups', GR: 'Collections', LI: 'Linked libraries',
  GD: 'Grease Pencil (legacy)', GP: 'Grease Pencil', MB: 'Metaballs',
  LT: 'Lattices', SO: 'Sounds', VF: 'Fonts', BR: 'Brushes', KE: 'Shape keys',
};

// Object.type values from DNA_object_types.h.
const OB_TYPES = {
  0: 'Empty', 1: 'Mesh', 2: 'Curve', 3: 'Surface', 4: 'Text', 5: 'Metaball',
  10: 'Light', 11: 'Camera', 12: 'Speaker', 13: 'Light probe', 22: 'Lattice',
  25: 'Armature', 26: 'Grease Pencil', 27: 'Curves', 28: 'Point cloud',
  29: 'Volume', 30: 'Grease Pencil',
};

const TYPE_READERS = {
  char: ['getUint8', 1], uchar: ['getUint8', 1], int8_t: ['getInt8', 1], uint8_t: ['getUint8', 1],
  short: ['getInt16', 2], ushort: ['getUint16', 2], int16_t: ['getInt16', 2], uint16_t: ['getUint16', 2],
  int: ['getInt32', 4], uint: ['getUint32', 4], int32_t: ['getInt32', 4], uint32_t: ['getUint32', 4],
  float: ['getFloat32', 4], double: ['getFloat64', 8],
  int64_t: ['getBigInt64', 8], uint64_t: ['getBigUint64', 8],
};

class BlendError extends Error {}

// ---------------------------------------------------------------------------
// Decompression

async function gunzip(u8) {
  if (typeof DecompressionStream === 'undefined') {
    throw new BlendError('This browser cannot decompress gzip .blend files.');
  }
  const stream = new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

// Blender writes zstd in the "seekable" format: independent frames followed by
// a skippable frame holding a seek table. Decoding frame by frame avoids relying
// on the decoder's handling of skippable frames.
function zstdSeekTable(u8) {
  const n = u8.length;
  if (n < 17) return null;
  const dv = new DataView(u8.buffer, u8.byteOffset, n);
  if (dv.getUint32(n - 4, true) !== 0x8f92eab1) return null;
  const numFrames = dv.getUint32(n - 9, true);
  const entry = (u8[n - 5] & 0x80) ? 12 : 8;
  const tableStart = n - 9 - numFrames * entry;
  if (tableStart < 0) return null;
  const frames = [];
  let off = 0;
  for (let i = 0; i < numFrames; i++) {
    const c = dv.getUint32(tableStart + i * entry, true);
    const d = dv.getUint32(tableStart + i * entry + 4, true);
    frames.push({ off, c, d });
    off += c;
  }
  return frames;
}

function unzstd(u8, zstdDecompress) {
  if (!zstdDecompress) throw new BlendError('zstd decoder not available.');
  const frames = zstdSeekTable(u8);
  if (!frames) return zstdDecompress(u8);
  const total = frames.reduce((s, f) => s + f.d, 0);
  const out = new Uint8Array(total);
  let pos = 0;
  for (const f of frames) {
    const part = zstdDecompress(u8.subarray(f.off, f.off + f.c));
    out.set(part, pos);
    pos += part.length;
  }
  return pos === total ? out : out.subarray(0, pos);
}

async function decompress(input, { zstdDecompress } = {}) {
  const u8 = input instanceof Uint8Array ? input : new Uint8Array(input);
  if (u8[0] === 0x1f && u8[1] === 0x8b) return { bytes: await gunzip(u8), compression: 'gzip' };

    return { bytes: unzstd(u8, zstdDecompress), compression: 'zstd' };
  }
  return { bytes: u8, compression: null };
}

// ---------------------------------------------------------------------------
// Low-level file structure

function ascii(u8, a, b) {
  return TEXT.decode(u8.subarray(a, b));

function readHeader(u8) {
  if (ascii(u8, 0, 7) !== 'BLENDER') {
    throw new BlendError('Not a .blend file (missing BLENDER header).');
  }
  const c = String.fromCharCode(u8[7]);

    return {
      size: 12, ptrSize: c === '-' ? 8 : 4, little: u8[8] === 0x76 /* v */,
      large: false, version: `${v[0]}.${Number(v.slice(1))}`, versionCode: Number(v),
    };
  }
  // Blender 5.0+: "BLENDER" + header size (2 digits) + "-" + format (2) + endian + version (4).
  const headerSize = Number(ascii(u8, 7, 9));
  const format = Number(ascii(u8, 10, 12));
  if (!Number.isFinite(headerSize) || format !== 1) {
    throw new BlendError(`Unsupported .blend header format "${ascii(u8, 0, 17)}".`);
  }
  const v = ascii(u8, 13, 17);
  return {
    size: headerSize, ptrSize: 8, little: u8[12] === 0x76, large: true,
    version: `${Number(v.slice(0, 2))}.${Number(v.slice(2))}`, versionCode: Number(v),
  };
}

function ptrKey(dv, off, ptrSize, little) {
  if (ptrSize === 4) {
    const lo = dv.getUint32(off, little);
    return lo === 0 ? null : lo.toString(16);
  }
  const a = dv.getUint32(off, little);
  const b = dv.getUint32(off + 4, little);
  const lo = little ? a : b;
  const hi = little ? b : a;
  if (lo === 0 && hi === 0) return null;
  return hi.toString(16) + lo.toString(16).padStart(8, '0');
}

function readBlocks(u8, dv, h) {
  const blocks = [];
  let p = h.size;
  const L = h.little;
  while (p + 8 <= u8.length) {
    const code = ascii(u8, p, p + 4).replace(/\0+$/, '');
    let len, old, sdna, nr, hsize;
    if (h.large) {
      sdna = dv.getInt32(p + 4, L);
      old = ptrKey(dv, p + 8, 8, L);
      len = Number(dv.getBigInt64(p + 16, L));
      nr = Number(dv.getBigInt64(p + 24, L));
      hsize = 32;
    } else {
      len = dv.getInt32(p + 4, L);
      old = ptrKey(dv, p + 8, h.ptrSize, L);
      sdna = dv.getInt32(p + 8 + h.ptrSize, L);
      nr = dv.getInt32(p + 12 + h.ptrSize, L);
      hsize = 16 + h.ptrSize;
    }
    if (code === 'ENDB') break;
    const off = p + hsize;
    if (len < 0 || off + len > u8.length) throw new BlendError('File is truncated or corrupt.');
    blocks.push({ code, off, len, old, sdna, nr });
    p = off + len;
  }
  return blocks;
}

function parseSDNA(u8, dv, block, h) {
  const L = h.little;
  const start = block.off;
  let p = start;
  const tag = () => { const t = ascii(u8, p, p + 4); p += 4; return t; };
  const align = () => { p = start + ((p - start + 3) & ~3); };
  const cstrings = (n) => {
    const out = new Array(n);
    for (let i = 0; i < n; i++) {
      let e = p;
      while (u8[e] !== 0) e++;
      out[i] = ascii(u8, p, e);
      p = e + 1;
    }
    return out;
  };
  if (tag() !== 'SDNA' || tag() !== 'NAME') throw new BlendError('Invalid SDNA block.');
  const nNames = dv.getInt32(p, L); p += 4;
  const names = cstrings(nNames);
  align();
  if (tag() !== 'TYPE') throw new BlendError('Invalid SDNA TYPE section.');
  const nTypes = dv.getInt32(p, L); p += 4;
  const types = cstrings(nTypes);
  align();
  if (tag() !== 'TLEN') throw new BlendError('Invalid SDNA TLEN section.');
  const tlen = new Array(nTypes);
  for (let i = 0; i < nTypes; i++) { tlen[i] = dv.getInt16(p, L); p += 2; }
  align();
  if (tag() !== 'STRC') throw new BlendError('Invalid SDNA STRC section.');
  const nStructs = dv.getInt32(p, L); p += 4;
  const structs = [];
  const structByName = new Map();
  for (let s = 0; s < nStructs; s++) {
    const typeIdx = dv.getInt16(p, L);
    const nFields = dv.getInt16(p + 2, L);
    p += 4;
    const fields = new Map();
    let off = 0;
    for (let f = 0; f < nFields; f++) {
      const ft = dv.getInt16(p, L);
      const fn = names[dv.getInt16(p + 2, L)];
      p += 4;
      const isPtr = fn.includes('*');
      const dims = [...fn.matchAll(/\[(\d+)\]/g)].map((m) => Number(m[1]));
      const count = fn.startsWith('(*') ? 1 : dims.reduce((a, b) => a * b, 1);
      const size = (isPtr ? h.ptrSize : tlen[ft]) * count;
      const base = fn.replace(/^\(?\*+/, '').replace(/\).*$/, '').replace(/\[.*$/, '');
      fields.set(base, { type: types[ft], typeIdx: ft, off, size, isPtr, count, dims });
      off += size;
    }
    const st = { name: types[typeIdx], size: tlen[typeIdx], fields };
    structs.push(st);
    structByName.set(st.name, st);
  }
  return { structs, structByName };
}

// ---------------------------------------------------------------------------
// Struct access

class View {
  constructor(file, struct, off) {
    this.file = file;
    this.struct = struct;
    this.off = off;
  }

  has(name) { return this.struct.fields.has(name); }

  field(name) {
    const f = this.struct.fields.get(name);
    if (!f) throw new BlendError(`${this.struct.name}.${name} not in this file's SDNA.`);
    return f;
  }

  num(name, i = 0) {
    const f = this.field(name);
    const r = TYPE_READERS[f.type];
    if (!r || f.isPtr) throw new BlendError(`${this.struct.name}.${name} is not numeric.`);
    const v = this.file.dv[r[0]](this.off + f.off + i * r[1], this.file.little);
    return typeof v === 'bigint' ? Number(v) : v;
  }

  numOr(name, fallback, i = 0) { return this.has(name) ? this.num(name, i) : fallback; }

  nums(name) {
    const f = this.field(name);
    const out = new Array(f.count);
    for (let i = 0; i < f.count; i++) out[i] = this.num(name, i);
    return out;
  }

  str(name) {
    const f = this.field(name);
    const u8 = this.file.u8;
    const a = this.off + f.off;
    let e = a;
    while (e < a + f.size && u8[e] !== 0) e++;
    return new TextDecoder('utf-8').decode(u8.subarray(a, e));
  }

  ptr(name) {
    const f = this.field(name);
    if (!f.isPtr) throw new BlendError(`${this.struct.name}.${name} is not a pointer.`);
    return ptrKey(this.file.dv, this.off + f.off, this.file.ptrSize, this.file.little);
  }

  sub(name) {
    const f = this.field(name);
    const st = this.file.sdna.structByName.get(f.type);
    if (!st) throw new BlendError(`${f.type} is not a struct.`);
    return new View(this.file, st, this.off + f.off);
  }
}

class BlendFile {
  constructor(u8, header) {
    this.u8 = u8;
    this.dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    this.header = header;
    this.little = header.little;
    this.ptrSize = header.ptrSize;
    this.blocks = readBlocks(u8, this.dv, header);
    const dna = this.blocks.find((b) => b.code === 'DNA1');
    if (!dna) throw new BlendError('File has no SDNA block.');
    this.sdna = parseSDNA(u8, this.dv, dna, header);
    // Pointers to ID blocks resolve file-wide; pointers to DATA blocks resolve
    // within the ID block they follow (Blender 5.0 reuses DATA addresses across
    // IDs, so a single file-wide map returns the wrong block).
    this.idByPtr = new Map();
    this.dataByPtr = new Map();
    let owner = null;
    for (const b of this.blocks) {
      if (b.code !== 'DATA') {
        owner = b;
        if (b.old) this.idByPtr.set(b.old, b);
        continue;
      }
      b.owner = owner;
      if (!b.old) continue;
      let m = this.dataByPtr.get(owner);
      if (!m) this.dataByPtr.set(owner, (m = new Map()));
      if (!m.has(b.old)) m.set(b.old, b);
    }
  }

  // `scope` is the ID block whose data is being read.
  block(key, scope = null) {
    if (!key) return null;
    const m = scope && this.dataByPtr.get(scope);
    return (m && m.get(key)) || this.idByPtr.get(key) || null;
  }

  structOf(block) { return this.sdna.structs[block.sdna]; }

  view(block, structName, index = 0) {
    const st = structName ? this.sdna.structByName.get(structName) : this.structOf(block);
    if (!st) return null;
    return new View(this, st, block.off + index * st.size);
  }

  // Pointer target as an array of `count` elements of a named struct.
  viewsAt(key, structName, count, scope) {
    const b = this.block(key, scope);
    const st = this.sdna.structByName.get(structName);
    if (!b || !st) return null;
    const n = Math.min(count, Math.floor(b.len / st.size));
    const out = new Array(n);
    for (let i = 0; i < n; i++) out[i] = new View(this, st, b.off + i * st.size);
    return out;
  }

  floatsAt(key, count, scope) {
    const b = this.block(key, scope);
    if (!b) return null;
    const n = Math.min(count, b.len >> 2);
    const out = new Float32Array(n);
    for (let i = 0; i < n; i++) out[i] = this.dv.getFloat32(b.off + i * 4, this.little);
    return out;
  }

  intsAt(key, count, scope) {
    const b = this.block(key, scope);
    if (!b) return null;
    const n = Math.min(count, b.len >> 2);
    const out = new Int32Array(n);
    for (let i = 0; i < n; i++) out[i] = this.dv.getInt32(b.off + i * 4, this.little);
    return out;
  }

  bytesAt(key, count, scope) {
    const b = this.block(key, scope);
    if (!b) return null;
    return this.u8.slice(b.off, b.off + Math.min(count, b.len));
  }

  ptrsAt(key, count, scope) {
    const b = this.block(key, scope);
    if (!b) return [];
    const n = Math.min(count, Math.floor(b.len / this.ptrSize));
    const out = [];
    for (let i = 0; i < n; i++) out.push(ptrKey(this.dv, b.off + i * this.ptrSize, this.ptrSize, this.little));
    return out;
  }

  idName(view) {
    if (!view || !view.has('id')) return '';
    return view.sub('id').str('name').slice(2);
  }
}

// ---------------------------------------------------------------------------
// Meshes

function customDataLayers(file, cd, scope) {
  if (!cd || !cd.has('layers')) return [];
  const n = cd.num('totlayer');
  const views = file.viewsAt(cd.ptr('layers'), 'CustomDataLayer', n, scope) || [];
  return views.map((v) => ({ type: v.num('type'), name: v.str('name'), data: v.ptr('data') }));
}

// Blender 5.0 moved some generic attributes into AttributeStorage.
function attributeStorageLayers(file, mesh, scope) {
  if (!mesh.has('attribute_storage')) return [];
  const as = mesh.sub('attribute_storage');
  if (!as.has('dna_attributes')) return [];
  const n = as.num('dna_attributes_num');
  const views = file.viewsAt(as.ptr('dna_attributes'), 'Attribute', n, scope) || [];
  const out = [];
  for (const a of views) {
    const nameBlock = file.block(a.ptr('name'), scope);
    const name = nameBlock ? ascii(file.u8, nameBlock.off, nameBlock.off + nameBlock.len).replace(/\0.*$/s, '') : '';
    let data = null;
    const dataBlock = file.block(a.ptr('data'), scope);
    if (dataBlock) {
      // Array attributes wrap their buffer in AttributeArray { void *data; ... }.
      const arr = file.view(dataBlock, 'AttributeArray');
      data = arr && arr.has('data') ? arr.ptr('data') : a.ptr('data');
    }
    // storage_type 1 = one value shared by every element (AttributeSingle).
    out.push({ name, domain: a.num('domain'), data, single: a.numOr('storage_type', 0) === 1 });
  }
  return out;
}

function findLayer(layers, name) {
  return layers.find((x) => x.name === name && x.data) || null;
}

// Reads a per-element attribute, expanding single-value storage to `count` elements.
function readAttr(file, l, count, scope, kind) {
  if (!l) return null;
  const read = { int: 'intsAt', float: 'floatsAt', byte: 'bytesAt' }[kind];
  if (!l.single) return file[read](l.data, count, scope);
  const one = file[read](l.data, 1, scope);
  if (!one || !one.length) return null;
  const out = new one.constructor(count);
  out.fill(one[0]);
  return out;
}

function readMesh(file, block) {
  const me = file.view(block, 'Mesh');
  const pick = (...names) => names.find((n) => me.has(n));
  const vertsNum = me.num(pick('verts_num', 'totvert'));
  const facesNum = me.has('faces_num') || me.has('totpoly') ? me.num(pick('faces_num', 'totpoly')) : 0;
  const cornersNum = me.has('corners_num') || me.has('totloop') ? me.num(pick('corners_num', 'totloop')) : 0;

  const S = block;
  const cd = (a, b) => (me.has(a) ? me.sub(a) : me.has(b) ? me.sub(b) : null);
  const vdata = customDataLayers(file, cd('vert_data', 'vdata'), S);
  const pdata = customDataLayers(file, cd('face_data', 'pdata'), S);
  const ldata = customDataLayers(file, cd('corner_data', 'ldata'), S);
  const storage = attributeStorageLayers(file, me, S);
  const layer = (list, name) => findLayer(list, name) || findLayer(storage, name);
  const attr = (list, name, count, kind) => readAttr(file, layer(list, name), count, block, kind);

  // Positions: generic "position" attribute (3.5+) or legacy MVert.co.
  let positions = null;
  positions = layer(vdata, 'position') && !layer(vdata, 'position').single ? file.floatsAt(layer(vdata, 'position').data, vertsNum * 3, S) : null;
  if (!positions && me.has('mvert')) {
    const mv = file.viewsAt(me.ptr('mvert'), 'MVert', vertsNum, S);
    if (mv) {
      positions = new Float32Array(mv.length * 3);
      mv.forEach((v, i) => { positions[i * 3] = v.num('co', 0); positions[i * 3 + 1] = v.num('co', 1); positions[i * 3 + 2] = v.num('co', 2); });
    }
  }
  if (!positions) return { error: 'vertex positions not found' };

  // Faces as (start, size) over a corner->vertex array.
  let cornerVerts = null;
  let faceStart = null;
  let faceSize = null;
  let faceMat = null;
  let faceSmooth = null; // 1 = smooth-shaded face

  const offKey = me.has('face_offset_indices') ? me.ptr('face_offset_indices')
    : me.has('poly_offset_indices') ? me.ptr('poly_offset_indices') : null;
  const cvLayer = layer(ldata, '.corner_vert');
  const offs = offKey ? file.intsAt(offKey, facesNum + 1, S) : null;
  if (offs && offs.length === facesNum + 1 && cvLayer) {
    cornerVerts = attr(ldata, '.corner_vert', cornersNum, 'int');
    faceStart = new Int32Array(facesNum);
    faceSize = new Int32Array(facesNum);
    for (let f = 0; f < facesNum; f++) { faceStart[f] = offs[f]; faceSize[f] = offs[f + 1] - offs[f]; }
  } else if (me.has('mpoly') && me.ptr('mpoly')) {
    const polys = file.viewsAt(me.ptr('mpoly'), 'MPoly', facesNum, S) || [];
    faceStart = new Int32Array(polys.length);
    faceSize = new Int32Array(polys.length);
    faceMat = new Int32Array(polys.length);
    faceSmooth = new Uint8Array(polys.length);
    polys.forEach((p, f) => {
      faceStart[f] = p.num('loopstart'); faceSize[f] = p.num('totloop'); faceMat[f] = p.numOr('mat_nr', 0);
      faceSmooth[f] = p.numOr('flag', 0) & 1; // ME_SMOOTH
    });
    if (cvLayer) cornerVerts = attr(ldata, '.corner_vert', cornersNum, 'int');
    else {
      const loops = file.viewsAt(me.ptr('mloop'), 'MLoop', cornersNum, S) || [];
      cornerVerts = Int32Array.from(loops, (l) => l.num('v'));
    }
  } else if (me.has('mface') && me.ptr('mface')) {
    // Pre-2.63 tessellated faces: tris and quads only.
    const totface = me.num('totface');
    const mf = file.viewsAt(me.ptr('mface'), 'MFace', totface, S) || [];
    cornerVerts = new Int32Array(mf.length * 4);
    faceStart = new Int32Array(mf.length);
    faceSize = new Int32Array(mf.length);
    faceMat = new Int32Array(mf.length);
    faceSmooth = new Uint8Array(mf.length);
    let c = 0;
    mf.forEach((f, i) => {
      const vs = [f.num('v1'), f.num('v2'), f.num('v3'), f.num('v4')];
      const n = vs[3] ? 4 : 3;
      faceStart[i] = c; faceSize[i] = n; faceMat[i] = f.numOr('mat_nr', 0);
      faceSmooth[i] = f.numOr('flag', 0) & 1;
      for (let k = 0; k < n; k++) cornerVerts[c++] = vs[k];
    });
  }

  // Newer files store sharpness as a "sharp_face" bool attribute; when it is
  // absent, every face is smooth.
  if (faceStart && !faceSmooth) {
    const sharp = attr(pdata, 'sharp_face', faceStart.length, 'byte');
    faceSmooth = new Uint8Array(faceStart.length);
    for (let f = 0; f < faceStart.length; f++) faceSmooth[f] = sharp && sharp[f] ? 0 : 1;
  }
  let smoothFaces = 0;
  if (faceSmooth) for (let f = 0; f < faceSmooth.length; f++) smoothFaces += faceSmooth[f];

  const matIdx = faceStart ? attr(pdata, 'material_index', faceStart.length, 'int') : null;
  if (matIdx) faceMat = matIdx;

  // Material slots on the mesh.
  const totcol = me.numOr('totcol', 0);
  const materials = file.ptrsAt(me.has('mat') ? me.ptr('mat') : null, totcol, S).map((k) => readMaterial(file, k));

  // Fan-triangulate each face, bucketed by material slot.
  const buckets = new Map();
  let triCount = 0;
  if (faceStart && cornerVerts) {
    for (let f = 0; f < faceStart.length; f++) {
      const n = faceSize[f];
      if (n < 3) continue;
      const m = faceMat ? Math.max(0, faceMat[f]) : 0;
      let arr = buckets.get(m);
      if (!arr) buckets.set(m, (arr = []));
      const s = faceStart[f];
      const a = cornerVerts[s];
      for (let k = 1; k < n - 1; k++) {
        arr.push(a, cornerVerts[s + k], cornerVerts[s + k + 1]);
        triCount++;
      }
    }
  }
  const indices = new Uint32Array(triCount * 3);
  const groups = [];
  let pos = 0;
  for (const m of [...buckets.keys()].sort((x, y) => x - y)) {
    const arr = buckets.get(m);
    indices.set(arr, pos);
    groups.push({ start: pos, count: arr.length, materialIndex: m });
    pos += arr.length;
  }
  // Drop indices that point past the vertex array (defensive against odd files).
  const nv = positions.length / 3;
  for (let i = 0; i < indices.length; i++) if (indices[i] >= nv) indices[i] = 0;

  return {
    name: file.idName(me),
    positions, indices, groups, materials,
    vertCount: nv, faceCount: faceStart ? faceStart.length : 0, triCount,
    // Share of faces Blender shades smooth (0..1); the viewer shades the whole mesh by majority.
    smoothRatio: faceStart && faceStart.length ? smoothFaces / faceStart.length : 0,
  };
}

function readMaterial(file, key) {
  const b = file.block(key);
  if (!b || b.code !== 'MA') return null;
  const ma = file.view(b, 'Material');
  return {
    name: file.idName(ma),
    color: [ma.numOr('r', 0.8), ma.numOr('g', 0.8), ma.numOr('b', 0.8)],
    alpha: ma.numOr('a', 1),
    metallic: ma.numOr('metallic', 0),
    roughness: ma.numOr('roughness', 0.5),
  };
}

// ---------------------------------------------------------------------------
// Transforms (column-major 4x4, same layout as Blender's float[4][4] and three.js)

function mul4(a, b) {
  const o = new Array(16);
  for (let c = 0; c < 4; c++) {
    for (let r = 0; r < 4; r++) {
      let s = 0;
      for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
      o[c * 4 + r] = s;
    }
  }
  return o;
}

function rotAxis(axis, t) {
  const c = Math.cos(t), s = Math.sin(t);
  // 3x3 row-major
  if (axis === 'X') return [1, 0, 0, 0, c, -s, 0, s, c];
  if (axis === 'Y') return [c, 0, s, 0, 1, 0, -s, 0, c];
  return [c, -s, 0, s, c, 0, 0, 0, 1];
}

function mul3(a, b) {
  const o = new Array(9);
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
    o[r * 3 + c] = a[r * 3] * b[c] + a[r * 3 + 1] * b[3 + c] + a[r * 3 + 2] * b[6 + c];
  }
  return o;
}

function quatTo3(w, x, y, z) {
  const n = Math.hypot(w, x, y, z) || 1;
  w /= n; x /= n; y /= n; z /= n;
  return [
    1 - 2 * (y * y + z * z), 2 * (x * y - w * z), 2 * (x * z + w * y),
    2 * (x * y + w * z), 1 - 2 * (x * x + z * z), 2 * (y * z - w * x),
    2 * (x * z - w * y), 2 * (y * z + w * x), 1 - 2 * (x * x + y * y),
  ];
}

const EULER_ORDERS = { 1: 'XYZ', 2: 'XZY', 3: 'YXZ', 4: 'YZX', 5: 'ZXY', 6: 'ZYX' };

function localMatrix(ob) {
  const loc = ob.nums('loc');
  const dloc = ob.has('dloc') ? ob.nums('dloc') : [0, 0, 0];
  const scale = ob.has('scale') ? ob.nums('scale') : ob.has('size') ? ob.nums('size') : [1, 1, 1];
  const dscale = ob.has('dscale') ? ob.nums('dscale') : [1, 1, 1];
  const mode = ob.numOr('rotmode', 1);
  let R;
  if (mode === 0) {
    const q = ob.nums('quat');
    R = quatTo3(q[0], q[1], q[2], q[3]);
  } else if (mode === -1) {
    const ax = ob.nums('rotAxis');
    const ang = ob.num('rotAngle');
    const l = Math.hypot(...ax) || 1;
    const h = ang / 2;
    R = quatTo3(Math.cos(h), (ax[0] / l) * Math.sin(h), (ax[1] / l) * Math.sin(h), (ax[2] / l) * Math.sin(h));
  } else {
    const order = EULER_ORDERS[mode] || 'XYZ';
    const rot = ob.nums('rot');
    const angle = { X: rot[0], Y: rot[1], Z: rot[2] };
    // Blender applies the first letter first: XYZ => Rz * Ry * Rx.
    R = mul3(rotAxis(order[2], angle[order[2]]), mul3(rotAxis(order[1], angle[order[1]]), rotAxis(order[0], angle[order[0]])));
  }
  const s = [scale[0] * dscale[0], scale[1] * dscale[1], scale[2] * dscale[2]];
  return [
    R[0] * s[0], R[3] * s[0], R[6] * s[0], 0,
    R[1] * s[1], R[4] * s[1], R[7] * s[1], 0,
    R[2] * s[2], R[5] * s[2], R[8] * s[2], 0,
    loc[0] + dloc[0], loc[1] + dloc[1], loc[2] + dloc[2], 1,
  ];
}

function storedWorldMatrix(ob) {
  for (const name of ['object_to_world', 'obmat']) {
    if (ob.has(name)) {
      const m = ob.nums(name);
      if (m.some((v) => v !== 0) && m.every(Number.isFinite)) return m;
    }
  }
  return null;
}

// ---------------------------------------------------------------------------
// Thumbnail ("TEST" block: int width, int height, RGBA rows bottom-up)

function readThumbnail(file) {
  const b = file.blocks.find((x) => x.code === 'TEST');
  if (!b || b.len < 8) return null;
  const w = file.dv.getInt32(b.off, file.little);
  const h = file.dv.getInt32(b.off + 4, file.little);
  if (w <= 0 || h <= 0 || w > 4096 || h > 4096 || 8 + w * h * 4 > b.len) return null;
  const rgba = new Uint8ClampedArray(w * h * 4);
  for (let y = 0; y < h; y++) {
    const src = b.off + 8 + (h - 1 - y) * w * 4;
    rgba.set(file.u8.subarray(src, src + w * 4), y * w * 4);
  }
  return { width: w, height: h, rgba };
}

// ---------------------------------------------------------------------------
// Public entry point

async function parseBlend(input, options = {}) {
  const { bytes, compression } = await decompress(input, options);
  const header = readHeader(bytes);
  const file = new BlendFile(bytes, header);
  const warnings = [];

  const inventory = {};
  for (const b of file.blocks) {
    if (ID_CODES[b.code]) inventory[ID_CODES[b.code]] = (inventory[ID_CODES[b.code]] || 0) + 1;
  }

  const meshes = new Map();
  const meshFor = (key) => {
    if (!key) return null;
    if (meshes.has(key)) return meshes.get(key);
    const b = file.block(key);
    let mesh = null;
    if (b && b.code === 'ME') {
      try { mesh = readMesh(file, b); } catch (e) { mesh = { error: e.message }; }
    }
    meshes.set(key, mesh);
    return mesh;
  };

  const obBlocks = file.blocks.filter((b) => b.code === 'OB');
  const obViews = new Map(obBlocks.map((b) => [b.old, file.view(b, 'Object')]));
  const worldCache = new Map();
  const worldOf = (key, depth = 0) => {
    if (worldCache.has(key)) return worldCache.get(key);
    const ob = obViews.get(key);
    let m = storedWorldMatrix(ob);
    if (!m) {
      m = localMatrix(ob);
      const parent = ob.has('parent') ? ob.ptr('parent') : null;
      if (parent && obViews.has(parent) && depth < 64) {
        m = mul4(mul4(worldOf(parent, depth + 1), ob.nums('parentinv')), m);
      }
    }
    worldCache.set(key, m);
    return m;
  };

  let modifierCount = 0;
  const objects = obBlocks.map((b) => {
    const ob = obViews.get(b.old);
    const type = ob.num('type');
    const parentKey = ob.has('parent') ? ob.ptr('parent') : null;
    const mods = ob.has('modifiers') && ob.sub('modifiers').ptr('first');
    if (mods) modifierCount++;
    const o = {
      id: b.old,
      name: file.idName(ob),
      type,
      typeName: OB_TYPES[type] || `Type ${type}`,
      parent: parentKey && obViews.has(parentKey) ? file.idName(obViews.get(parentKey)) : null,
      matrix: worldOf(b.old),
      hasModifiers: Boolean(mods),
      mesh: null,
    };
    if (type === 1) {
      const mesh = meshFor(ob.ptr('data'));
      if (mesh && !mesh.error) o.mesh = mesh;
      else warnings.push(`Mesh for "${o.name}" could not be read${mesh && mesh.error ? `: ${mesh.error}` : ''}.`);
    }
    return o;
  });

  if (modifierCount) {
    warnings.push(`${modifierCount} object(s) use modifiers. The preview shows the base mesh without modifiers applied.`);
  }
  if (inventory['Linked libraries']) {
    warnings.push('This file links data from other .blend files. Linked objects are not included.');
  }
  const unsupported = objects.filter((o) => [2, 3, 4, 5, 27, 28, 29].includes(o.type));
  if (unsupported.length) {
    warnings.push(`${unsupported.length} curve, text, metaball, hair, point-cloud or volume object(s) are listed but not drawn.`);
  }

  return {
    version: header.version,
    versionCode: header.versionCode,
    pointerSize: header.ptrSize,
    endian: header.little ? 'little' : 'big',
    compression,
    fileSize: input.byteLength ?? input.length,
    dataSize: bytes.length,
    blockCount: file.blocks.length,
    thumbnail: readThumbnail(file),
    inventory,
    objects,
    warnings,
  };
}

return { parseBlend };
})();

const SHARE_URL = '';

// ---------------------------------------------------------------- renderer
const canvas = $('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.setClearColor(0x2a2c30);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
scene.add(new THREE.HemisphereLight(0xe6ecff, 0x3a3430, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, -6, 9);
scene.add(key);
const rim = new THREE.DirectionalLight(0xbfd4ff, 0.6);
rim.position.set(-6, 5, 3);
scene.add(rim);

const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 1000);
camera.position.set(7.4, -6.9, 5);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = !reduceMotion;
controls.dampingFactor = 0.12;
controls.screenSpacePanning = true;

// Floor grid on the XY plane plus the red X / green Y axis lines Blender draws.
const grid = new THREE.Group();
function buildGrid(size) {
  grid.clear();
  const step = Math.pow(10, Math.floor(Math.log10(Math.max(size, 0.1))));
  const half = Math.ceil(size / step) * step * 2;
  const g = new THREE.GridHelper(half * 2, Math.round((half * 2) / step), 0x3a3e45, 0x33363c);
  g.rotation.x = Math.PI / 2;
  g.material.transparent = true;
  g.material.opacity = 0.9;
  grid.add(g);
  const axis = (a, b, color) => {
    const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
    grid.add(new THREE.Line(geo, new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.8 })));
  };
  axis(new THREE.Vector3(-half * 2, 0, 0), new THREE.Vector3(half * 2, 0, 0), 0xb13a3e);
  axis(new THREE.Vector3(0, -half * 2, 0), new THREE.Vector3(0, half * 2, 0), 0x6c9a3c);
}
buildGrid(5);
scene.add(grid);

const content = new THREE.Group();
scene.add(content);

let needsRender = true;
const requestRender = () => { needsRender = true; };
controls.addEventListener('change', requestRender);

// On phones the bottom sheet covers part of the canvas. Shift the projection
// centre up so framed models sit in the visible area instead of under the sheet.
let coveredPx = 0;
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  const sheet = document.getElementById('sheet');
  const sr = sheet.getBoundingClientRect(), cr = canvas.getBoundingClientRect();
  coveredPx = Math.max(0, Math.min(h * 0.7, cr.bottom - Math.max(sr.top, cr.top)));
  if (sr.left >= cr.right - 1) coveredPx = 0; // side panel layout
  camera.aspect = w / h;
  if (coveredPx) camera.setViewOffset(w, h, 0, coveredPx / 2, w, h); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  requestRender();
}
new ResizeObserver(resize).observe(canvas);
document.getElementById('sheet').addEventListener('transitionend', resize);

let tween = null;
function loop(t) {
  requestAnimationFrame(loop);
  if (tween) {
    const k = Math.min(1, (t - tween.t0) / tween.dur);
    const e = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.c0, tween.c1, e);
    if (k >= 1) tween = null;
    needsRender = true;
  }
  if (controls.update()) needsRender = true;
  if (needsRender) {
    needsRender = false;
    renderer.render(scene, camera);
    drawGizmo();
  }
}
requestAnimationFrame(loop);

// ---------------------------------------------------------------- axis gizmo
const gctx = $('gizmo').getContext('2d');
const AXES = [
  { v: new THREE.Vector3(1, 0, 0), label: 'X', color: '#e5484d' },
  { v: new THREE.Vector3(0, 1, 0), label: 'Y', color: '#86c34a' },
  { v: new THREE.Vector3(0, 0, 1), label: 'Z', color: '#4d8ef0' },
];
function drawGizmo() {
  const s = 168, c = s / 2, r = 54;
  gctx.clearRect(0, 0, s, s);
  const q = camera.quaternion.clone().invert();
  const pts = [];
  for (const a of AXES) {
    const p = a.v.clone().applyQuaternion(q);
    pts.push({ ...a, x: c + p.x * r, y: c - p.y * r, z: p.z, pos: true });
    pts.push({ ...a, x: c - p.x * r, y: c + p.y * r, z: -p.z, pos: false });
  }
  pts.sort((a, b) => a.z - b.z);
  for (const p of pts) {
    if (p.pos) {
      gctx.strokeStyle = p.color; gctx.lineWidth = 4;
      gctx.beginPath(); gctx.moveTo(c, c); gctx.lineTo(p.x, p.y); gctx.stroke();
    }
    gctx.beginPath(); gctx.arc(p.x, p.y, p.pos ? 15 : 11, 0, Math.PI * 2);
    gctx.fillStyle = p.pos ? p.color : p.color + '55';
    gctx.fill();
    if (p.pos) {
      gctx.fillStyle = '#17191c'; gctx.font = '700 17px Figtree, system-ui, sans-serif';
      gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
      gctx.fillText(p.label, p.x, p.y + 1);
    }
  }
}

// ---------------------------------------------------------------- scene state
const state = {
  entries: [],          // { name, typeName, parent, object3d, mesh?, meta, hidden }
  selected: null,
  shading: 'material',  // solid | material | wire
  normals: 'auto',      // auto (per mesh, as saved) | flat | smooth
  viewIndex: 0,
};

const solidMat = new THREE.MeshStandardMaterial({ color: 0xc9cacd, roughness: 0.62, metalness: 0, flatShading: true, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1, side: THREE.DoubleSide });
const hiddenMat = new THREE.MeshBasicMaterial({ visible: false });
const wireMat = new THREE.LineBasicMaterial({ color: 0xc4c7cd });
const selectMat = new THREE.LineBasicMaterial({ color: 0xf0a43a });
const helperMat = new THREE.LineBasicMaterial({ color: 0x8d9199 });

function makeSlotMaterial(m) {
  const mat = new THREE.MeshStandardMaterial({
    color: 0xc9cacd, roughness: 0.5, metalness: 0, flatShading: true, side: THREE.DoubleSide,
    polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
  });
  if (m) {
    // Blender stores viewport colours in scene-linear space.
    mat.color.setRGB(m.color[0], m.color[1], m.color[2], THREE.LinearSRGBColorSpace);
    mat.metalness = m.metallic;
    mat.roughness = m.roughness;
    if (m.alpha < 0.999) { mat.transparent = true; mat.opacity = m.alpha; }
  }
  return mat;
}

function applyShading() {
  for (const e of state.entries) {
    const o = e.object3d;
    if (!o || !o.isMesh) continue;
    o.material = state.shading === 'wire' ? hiddenMat : state.shading === 'solid' ? solidMat : o.userData.slotMats;
    const flat = state.normals === 'auto' ? o.userData.autoFlat : state.normals === 'flat';
    if (state.shading === 'solid') o.material = o.userData.solidMat;
    for (const m of (Array.isArray(o.material) ? o.material : [o.material])) {
      if ('flatShading' in m && m.flatShading !== flat) { m.flatShading = flat; m.needsUpdate = true; }
    }
    let wire = o.getObjectByName('wire');
    if (state.shading === 'wire' && !wire) {
      wire = new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry, 1), wireMat);
      wire.name = 'wire';
      o.add(wire);
    }
    if (wire) wire.visible = state.shading === 'wire';
  }
  $('shadeLabel').textContent = { solid: 'Solid', material: 'Material', wire: 'Wire' }[state.shading];
  $('smoothLabel').textContent = { auto: 'Auto', flat: 'Flat', smooth: 'Smooth' }[state.normals];
  requestRender();
}

function clearScene() {
  content.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    const mats = o.userData.slotMats;
    if (mats) [].concat(mats).forEach((m) => m.dispose());
    if (o.userData.solidMat) o.userData.solidMat.dispose();
  });
  content.clear();
  state.entries = [];
  state.selected = null;
}

// Small wire glyphs for cameras, lights and empties so the layout reads.
function helperFor(typeName) {
  const pts = [];
  if (typeName === 'Camera') {
    const c = [[-0.5, -0.32, -1], [0.5, -0.32, -1], [0.5, 0.32, -1], [-0.5, 0.32, -1]];
    for (let i = 0; i < 4; i++) pts.push(0, 0, 0, ...c[i], ...c[i], ...c[(i + 1) % 4]);
    pts.push(-0.3, 0.4, -1, 0, 0.6, -1, 0, 0.6, -1, 0.3, 0.4, -1, 0.3, 0.4, -1, -0.3, 0.4, -1);
  } else if (typeName === 'Light') {
    const n = 16;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2, b = ((i + 1) / n) * Math.PI * 2;
      pts.push(Math.cos(a) * 0.15, Math.sin(a) * 0.15, 0, Math.cos(b) * 0.15, Math.sin(b) * 0.15, 0);
    }
    pts.push(0, 0, 0, 0, 0, -1);
  } else {
    pts.push(-0.4, 0, 0, 0.4, 0, 0, 0, -0.4, 0, 0, 0.4, 0, 0, 0, -0.4, 0, 0, 0.4);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  return new THREE.LineSegments(g, helperMat);
}

// ---------------------------------------------------------------- .blend → three.js
function buildFromBlend(result) {
  const geoCache = new Map();
  for (const o of result.objects) {
    let obj;
    let meta = o.typeName;
    if (o.mesh) {
      const m = o.mesh;
      let geo = geoCache.get(m);
      if (!geo) {
        geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(m.positions, 3));
        geo.setIndex(new THREE.BufferAttribute(m.indices, 1));
        geo.computeVertexNormals();
        geo.computeBoundingSphere();
        geoCache.set(m, geo);
      }
      const slotMats = (m.materials.length ? m.materials : [null]).map(makeSlotMaterial);
      geo.clearGroups();
      for (const g of m.groups) geo.addGroup(g.start, g.count, Math.min(g.materialIndex, slotMats.length - 1));
      obj = new THREE.Mesh(geo, slotMats);
      obj.userData.slotMats = slotMats;
      obj.userData.solidMat = solidMat.clone();
      obj.userData.autoFlat = m.smoothRatio < 0.5;
      meta = `${fmt.format(m.vertCount)} v · ${fmt.format(m.faceCount)} f`;
    } else {
      obj = helperFor(o.typeName);
    }
    obj.matrixAutoUpdate = false;
    obj.matrix.fromArray(o.matrix);
    obj.name = o.name;
    content.add(obj);
    state.entries.push({ name: o.name, typeName: o.typeName, parent: o.parent, object3d: obj, meta, mesh: o.mesh, modifiers: o.hasModifiers, hidden: false });
  }
  content.updateMatrixWorld(true);
}

// ---------------------------------------------------------------- other formats
const Y_UP = new Set(['glb', 'gltf', 'obj', 'fbx']);
async function loadOther(ext, buffer) {
  let root;
  if (ext === 'glb' || ext === 'gltf') {
    const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
    root = await new Promise((res, rej) => new GLTFLoader().parse(buffer, '', (g) => res(g.scene), rej));
  } else if (ext === 'obj') {
    const { OBJLoader } = await import('three/addons/loaders/OBJLoader.js');
    root = new OBJLoader().parse(new TextDecoder().decode(buffer));
  } else if (ext === 'fbx') {
    const { FBXLoader } = await import('three/addons/loaders/FBXLoader.js');
    root = new FBXLoader().parse(buffer, '');
  } else if (ext === 'stl' || ext === 'ply') {
    const mod = ext === 'stl' ? await import('three/addons/loaders/STLLoader.js') : await import('three/addons/loaders/PLYLoader.js');
    const Loader = ext === 'stl' ? mod.STLLoader : mod.PLYLoader;
    const geo = new Loader().parse(buffer);
    if (!geo.attributes.normal) geo.computeVertexNormals();
    root = new THREE.Mesh(geo);
    root.name = 'Mesh';
  }
  if (Y_UP.has(ext)) root.rotation.x = Math.PI / 2;
  root.updateMatrixWorld(true);
  let i = 0;
  root.traverse((o) => {
    if (!o.isMesh) return;
    const src = Array.isArray(o.material) ? o.material : [o.material];
    const slotMats = src.map((m) => {
      if (m && m.isMeshStandardMaterial) { m.flatShading = true; m.side = THREE.DoubleSide; return m; }
      const s = makeSlotMaterial(null);
      if (m && m.color) s.color.copy(m.color);
      if (m && m.map) s.map = m.map;
      return s;
    });
    o.userData.slotMats = Array.isArray(o.material) ? slotMats : slotMats[0];
    o.userData.solidMat = solidMat.clone();
    o.userData.autoFlat = false; // exports carry their own normals
    const pos = o.geometry.attributes.position;
    const tris = o.geometry.index ? o.geometry.index.count / 3 : pos.count / 3;
    state.entries.push({ name: o.name || `Mesh ${++i}`, typeName: 'Mesh', parent: null, object3d: o, mesh: { vertCount: pos.count, triCount: tris }, meta: `${fmt.format(pos.count)} v · ${fmt.format(tris)} tris`, hidden: false });
  });
  content.add(root);
  content.updateMatrixWorld(true);
}

// ---------------------------------------------------------------- loading
let loadToken = 0;
function showStatus(kind, title, text) {
  const el = $('status');
  if (!kind) { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  el.innerHTML = '';
  const card = document.createElement('div');
  card.className = `status-card ${kind}`;
  if (kind === 'busy') card.append(Object.assign(document.createElement('div'), { className: 'spinner' }));
  card.append(Object.assign(document.createElement('h2'), { textContent: title }));
  if (text) card.append(Object.assign(document.createElement('p'), { textContent: text }));
  el.append(card);
}

const sizeLabel = (n) => (n >= 1 << 20 ? `${(n / (1 << 20)).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`);
const nextFrame = () => new Promise((r) => setTimeout(r, 30));

async function openBuffer(name, buffer) {
  const token = ++loadToken;
  const ext = (name.split('.').pop() || '').toLowerCase().replace(/\d+$/, '');
  showStatus('busy', `Opening ${name}`, `Reading ${sizeLabel(buffer.byteLength)}…`);
  await nextFrame();
  try {
    let result = null;
    const head = new Uint8Array(buffer, 0, Math.min(8, buffer.byteLength));
    const looksBlend = ext === 'blend' || String.fromCharCode(...head.subarray(0, 7)) === 'BLENDER' || (head[0] === 0x28 && head[1] === 0xb5) || (head[0] === 0x1f && head[1] === 0x8b);
    if (looksBlend) {
      result = await parseBlend(buffer, { zstdDecompress });
      if (token !== loadToken) return;
      clearScene();
      buildFromBlend(result);
    } else if (['glb', 'gltf', 'obj', 'fbx', 'stl', 'ply'].includes(ext)) {
      clearScene();
      await loadOther(ext, buffer);
    } else {
      throw new Error(`".${ext}" files are not supported. Open a .blend file, or a GLB, OBJ, FBX, STL or PLY export.`);
    }
    if (token !== loadToken) return;
    showStatus(null);
    $('fileName').textContent = name;
    const chip = $('fileChip');
    chip.hidden = false;
    chip.textContent = result ? `Blender ${result.version}` : ext.toUpperCase();
    applyShading();
    fitGrid();
    setView(0, false);
    frameAll(false);
    renderOutliner();
    renderFileInfo(name, buffer.byteLength, result);
    const meshes = state.entries.filter((e) => e.mesh);
    if (!meshes.length) showStatus('error', 'No meshes to draw', 'This file opened, but it has no mesh objects the viewer can draw. The File tab lists what it contains.');
  } catch (err) {
    if (token !== loadToken) return;
    console.error(err);
    showStatus('error', `Couldn't open ${name}`, err.message || String(err));
  }
}

async function openFile(file) {
  if (!file) return;
  try {
    const buffer = await file.arrayBuffer();
    await openBuffer(file.name, buffer);
  } catch (err) {
    showStatus('error', `Couldn't read ${file.name}`, 'The browser could not read this file. It may be too large for this device’s memory.');
  }
}

$('fileInput').addEventListener('change', (e) => { pickerSeen = true; openFile(e.target.files[0]); e.target.value = ''; });

// Some Android in-app browsers (WebViews) never show a file picker, and a web
// page cannot override that. Detect "tapped Open, but no picker appeared" by
// watching for the page losing focus or visibility, and offer a way out.
let pickerSeen = true;
let pickerTimer;
const markPicker = () => { pickerSeen = true; };
addEventListener('blur', markPicker);
addEventListener('pagehide', markPicker);
document.addEventListener('visibilitychange', () => { if (document.hidden) markPicker(); });
$('fileInput').addEventListener('cancel', markPicker);
$('fileInput').addEventListener('click', () => {
  pickerSeen = false;
  clearTimeout(pickerTimer);
  pickerTimer = setTimeout(() => { if (!pickerSeen) showPickerHelp(); }, 1500);
});

function showPickerHelp() {
  const el = $('status');
  el.hidden = false;
  el.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'status-card';
  card.append(Object.assign(document.createElement('h2'), { textContent: 'No file picker appeared?' }));
  card.append(Object.assign(document.createElement('p'), {
    textContent: IN_ANDROID_WEBVIEW || !SHARE_URL
      ? 'The app you opened this page in blocks file pickers. Web pages can\u2019t change that. Open the page in Chrome instead:'
      : 'Your browser blocked the file picker for this page. Open it in Chrome instead:',
  }));
  const steps = document.createElement('ol');
  const items = SHARE_URL
    ? ['Tap \u201cOpen in Chrome\u201d below. If it opens inside the app again, use \u201cCopy link\u201d.', 'Paste the link into Chrome and sign in to claude.ai if asked.', 'Tap Open and choose your .blend file.']
    : ['In the app\u2019s menu (\u22ee), choose \u201cOpen in browser\u201d or \u201cOpen in Chrome\u201d.', 'Tap Open and choose your .blend file.'];
  for (const t of items) steps.append(Object.assign(document.createElement('li'), { textContent: t }));
  card.append(steps);
  const actions = document.createElement('div');
  actions.className = 'status-actions';
  if (SHARE_URL) {
    // intent: URLs hand the link to Chrome itself on Android; elsewhere use the plain link.
    const android = /Android/i.test(navigator.userAgent);
    const href = android
      ? `intent://${SHARE_URL.replace(/^https?:\/\//, '')}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${encodeURIComponent(SHARE_URL)};end`
      : SHARE_URL;
    actions.append(Object.assign(document.createElement('a'), { className: 'primary', href, target: '_blank', rel: 'noopener', textContent: 'Open in Chrome' }));
    const copy = Object.assign(document.createElement('button'), { type: 'button', textContent: 'Copy link' });
    copy.addEventListener('click', () => {
      navigator.clipboard.writeText(SHARE_URL)
        .then(() => { copy.textContent = 'Copied'; })
        .catch(() => { const r = document.createRange(); r.selectNodeContents(url); getSelection().removeAllRanges(); getSelection().addRange(r); copy.textContent = 'Select and copy the link below'; });
    });
    actions.append(copy);
  }
  const close = Object.assign(document.createElement('button'), { type: 'button', textContent: 'Close' });
  close.addEventListener('click', () => showStatus(null));
  actions.append(close);
  card.append(actions);
  const url = Object.assign(document.createElement('div'), { className: 'share-url', textContent: SHARE_URL });
  if (SHARE_URL) card.append(url);
  el.append(card);
}

let dragDepth = 0;
addEventListener('dragenter', (e) => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { dragDepth++; $('drop').hidden = false; e.preventDefault(); } });
addEventListener('dragover', (e) => e.preventDefault());
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('drop').hidden = true; } });
addEventListener('drop', (e) => { e.preventDefault(); dragDepth = 0; $('drop').hidden = true; openFile(e.dataTransfer?.files?.[0]); });

// ---------------------------------------------------------------- camera
const VIEWS = [
  { label: 'Persp', dir: new THREE.Vector3(0.66, -0.62, 0.42) },
  { label: 'Front', dir: new THREE.Vector3(0, -1, 0) },
  { label: 'Right', dir: new THREE.Vector3(1, 0, 0) },
  { label: 'Top', dir: new THREE.Vector3(0, -1e-4, 1) },
];

function visibleBox(entries) {
  const box = new THREE.Box3();
  for (const e of entries) if (e.mesh && !e.hidden) box.expandByObject(e.object3d);
  if (box.isEmpty()) for (const e of entries) if (!e.hidden) box.expandByObject(e.object3d);
  if (box.isEmpty()) box.setFromCenterAndSize(new THREE.Vector3(), new THREE.Vector3(2, 2, 2));
  return box;
}

function moveCamera(target, dir, dist, animate = true) {
  const p1 = target.clone().addScaledVector(dir.clone().normalize(), dist);
  camera.near = Math.max(dist / 1000, 1e-4);
  camera.far = dist * 100;
  camera.updateProjectionMatrix();
  if (!animate || reduceMotion) {
    tween = null;
    camera.position.copy(p1);
    controls.target.copy(target);
    controls.update();
  } else {
    tween = { t0: performance.now(), dur: 380, p0: camera.position.clone(), p1, c0: controls.target.clone(), c1: target.clone() };
  }
  requestRender();
}

function frameBox(box, animate = true) {
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  const r = Math.max(sphere.radius, 1e-3);
  const fov = THREE.MathUtils.degToRad(camera.fov);
  const h = canvas.clientHeight || 1;
  const visible = Math.max(0.3, (h - coveredPx) / h);
  const vfov = 2 * Math.atan(Math.tan(fov / 2) * visible);
  const fit = Math.min(vfov, 2 * Math.atan(Math.tan(fov / 2) * camera.aspect));
  const dist = (r / Math.sin(fit / 2)) * 1.05;
  const dir = camera.position.clone().sub(controls.target);
  moveCamera(sphere.center, dir.lengthSq() ? dir : VIEWS[0].dir, dist, animate);
}
const frameAll = (animate = true) => frameBox(visibleBox(state.entries), animate);
const frameSelected = () => state.selected && frameBox(visibleBox([state.selected]));

function setView(i, animate = true) {
  state.viewIndex = i;
  const dist = camera.position.distanceTo(controls.target) || 10;
  moveCamera(controls.target.clone(), VIEWS[i].dir, dist, animate);
  $('viewLabel').textContent = VIEWS[i].label;
}

function fitGrid() {
  const box = visibleBox(state.entries);
  const size = box.getSize(new THREE.Vector3());
  buildGrid(Math.max(size.x, size.y, 1));
}

// ---------------------------------------------------------------- selection
function select(entry, { frame = false } = {}) {
  if (state.selected?.object3d) {
    const old = state.selected.object3d.getObjectByName('selection');
    if (old) { old.geometry.dispose(); old.removeFromParent(); }
  }
  state.selected = entry && state.selected !== entry ? entry : entry && frame ? entry : null;
  if (state.selected?.object3d?.isMesh) {
    const lines = new THREE.LineSegments(new THREE.EdgesGeometry(state.selected.object3d.geometry, 30), selectMat);
    lines.name = 'selection';
    state.selected.object3d.add(lines);
  }
  if (frame && state.selected) frameSelected();
  document.querySelectorAll('.ol-row').forEach((r) => r.classList.toggle('selected', r.dataset.name === state.selected?.name));
  requestRender();
}

const raycaster = new THREE.Raycaster();
let down = null;
canvas.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6 || performance.now() - down.t > 400) return;
  const r = canvas.getBoundingClientRect();
  raycaster.setFromCamera(new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
  const meshes = state.entries.filter((x) => x.mesh && !x.hidden).map((x) => x.object3d);
  const hit = raycaster.intersectObjects(meshes, false)[0];
  const entry = hit && state.entries.find((x) => x.object3d === hit.object);
  if (entry) select(entry); else if (state.selected) select(null);
});

// ---------------------------------------------------------------- tools
let toastTimer;
function toast(text) {
  const t = $('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1100);
}
const SHADES = ['solid', 'material', 'wire'];
function cycleShading() {
  state.shading = SHADES[(SHADES.indexOf(state.shading) + 1) % SHADES.length];
  applyShading();
  toast({ solid: 'Solid shading', material: 'Material preview', wire: 'Wireframe' }[state.shading]);
}
$('frameBtn').addEventListener('click', () => (state.selected ? frameSelected() : frameAll()));
$('shadeBtn').addEventListener('click', cycleShading);
$('viewBtn').addEventListener('click', () => { setView((state.viewIndex + 1) % VIEWS.length); toast(`${VIEWS[state.viewIndex].label} view`); });
const NORMALS = ['auto', 'flat', 'smooth'];
$('smoothBtn').addEventListener('click', () => {
  state.normals = NORMALS[(NORMALS.indexOf(state.normals) + 1) % NORMALS.length];
  applyShading();
  toast({ auto: 'Shading as saved in Blender', flat: 'Flat shading', smooth: 'Smooth shading' }[state.normals]);
});
$('gridBtn').addEventListener('click', (e) => {
  grid.visible = !grid.visible;
  e.currentTarget.setAttribute('aria-pressed', String(grid.visible));
  requestRender();
});

// Blender's numpad conventions on desktop keyboards.
addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.code;
  if (k === 'Numpad1' || e.key === '1') setView(1);
  else if (k === 'Numpad3' || e.key === '3') setView(2);
  else if (k === 'Numpad7' || e.key === '7') setView(3);
  else if (k === 'Numpad5' || e.key === '5') setView(0);
  else if (k === 'Home') frameAll();
  else if (k === 'NumpadDecimal' || e.key === '.') frameSelected();
  else if (e.key === 'z' || e.key === 'Z') cycleShading();
  else return;
  e.preventDefault();
});

// ---------------------------------------------------------------- sheet & panels
$('sheetToggle').addEventListener('click', () => {
  if (matchMedia('(min-width: 900px)').matches) return;
  const open = $('sheet').classList.toggle('open');
  $('sheetToggle').setAttribute('aria-expanded', String(open));
  if (reduceMotion) resize();
});
function selectTab(which) {
  const outl = which === 'outliner';
  $('tabOutliner').setAttribute('aria-selected', String(outl));
  $('tabFile').setAttribute('aria-selected', String(!outl));
  $('outliner').hidden = !outl;
  $('fileInfo').hidden = outl;
  if (!$('sheet').classList.contains('open') && !matchMedia('(min-width: 900px)').matches) {
    $('sheet').classList.add('open');
    $('sheetToggle').setAttribute('aria-expanded', 'true');
    if (reduceMotion) resize();
  }
}
$('tabOutliner').addEventListener('click', () => selectTab('outliner'));
$('tabFile').addEventListener('click', () => selectTab('file'));

const ICONS = {
  Mesh: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M8 1.8 13.6 5v6L8 14.2 2.4 11V5Z"/><path d="M2.4 5 8 8.2 13.6 5M8 8.2v6"/></svg>',
  Camera: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><rect x="1.5" y="4.5" width="9" height="7" rx="1"/><path d="m10.5 7 4-2v6l-4-2"/></svg>',
  Light: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="7" r="3.5"/><path d="M6.5 13h3M8 1v.5M2 7h.5M13.5 7h.5"/></svg>',
  Other: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 2v12M2 8h12M4 4l8 8M12 4l-8 8" stroke-opacity=".8"/></svg>',
};
const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.8"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l16 16M9.9 5.8A9.6 9.6 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-3 3.8M6.3 7.4A16.6 16.6 0 0 0 2.5 12S6 18.5 12 18.5c1.5 0 2.9-.4 4.1-1"/></svg>';

function renderOutliner() {
  const root = $('outliner');
  root.innerHTML = '';
  const meshes = state.entries.filter((e) => e.mesh);
  const verts = meshes.reduce((s, e) => s + e.mesh.vertCount, 0);
  const tris = meshes.reduce((s, e) => s + e.mesh.triCount, 0);
  $('sumTitle').textContent = `${state.entries.length} object${state.entries.length === 1 ? '' : 's'}`;
  $('sumNums').textContent = `${fmt.format(verts)} verts · ${fmt.format(tris)} tris`;
  if (!state.entries.length) {
    root.append(Object.assign(document.createElement('p'), { className: 'ol-empty', textContent: 'This file has no objects.' }));
    return;
  }
  const names = new Set(state.entries.map((e) => e.name));
  const children = new Map();
  for (const e of state.entries) {
    const p = e.parent && names.has(e.parent) ? e.parent : '';
    if (!children.has(p)) children.set(p, []);
    children.get(p).push(e);
  }
  const walk = (parent, depth) => {
    for (const e of (children.get(parent) || []).sort((a, b) => a.name.localeCompare(b.name))) {
      const row = document.createElement('div');
      row.className = 'ol-row' + (e.hidden ? ' hidden' : '') + (state.selected === e ? ' selected' : '');
      row.dataset.name = e.name;
      const main = document.createElement('button');
      main.type = 'button';
      main.className = 'ol-main';
      main.style.paddingLeft = `${8 + depth * 18}px`;
      main.innerHTML = ICONS[e.typeName] || ICONS.Other;
      main.append(
        Object.assign(document.createElement('span'), { className: 'ol-name', textContent: e.name }),
        Object.assign(document.createElement('span'), { className: 'ol-meta', textContent: e.meta }),
      );
      main.title = e.modifiers ? `${e.name} (modifiers not applied in preview)` : e.name;
      main.addEventListener('click', () => select(e, { frame: true }));
      const eye = document.createElement('button');
      eye.type = 'button';
      eye.className = 'ol-eye';
      eye.setAttribute('aria-label', `${e.hidden ? 'Show' : 'Hide'} ${e.name}`);
      eye.innerHTML = e.hidden ? EYE_OFF : EYE;
      eye.addEventListener('click', () => {
        e.hidden = !e.hidden;
        e.object3d.visible = !e.hidden;
        row.classList.toggle('hidden', e.hidden);
        eye.innerHTML = e.hidden ? EYE_OFF : EYE;
        eye.setAttribute('aria-label', `${e.hidden ? 'Show' : 'Hide'} ${e.name}`);
        requestRender();
      });
      row.append(main, eye);
      root.append(row);
      walk(e.name, depth + 1);
    }
  };
  walk('', 0);
}

function renderFileInfo(name, size, r) {
  const root = $('fileInfo');
  root.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'info';

  const thumb = document.createElement('div');
  thumb.className = 'thumb';
  if (r?.thumbnail) {
    const c = document.createElement('canvas');
    c.width = r.thumbnail.width;
    c.height = r.thumbnail.height;
    c.getContext('2d').putImageData(new ImageData(r.thumbnail.rgba, r.thumbnail.width, r.thumbnail.height), 0, 0);
    c.setAttribute('role', 'img');
    c.setAttribute('aria-label', 'Thumbnail saved inside the file');
    thumb.append(c);
  }
  thumb.append(Object.assign(document.createElement('p'), {
    textContent: r?.thumbnail ? 'Thumbnail Blender saved inside this file.' : r ? 'No thumbnail saved in this file. Blender only writes one when saving from its window.' : 'Exported model file.',
  }));
  wrap.append(thumb);

  const dl = document.createElement('dl');
  dl.className = 'facts';
  const fact = (k, v) => dl.append(Object.assign(document.createElement('dt'), { textContent: k }), Object.assign(document.createElement('dd'), { textContent: v }));
  fact('File', name);
  fact('Size on disk', sizeLabel(size));
  if (r) {
    fact('Saved by', `Blender ${r.version}`);
    fact('Compression', { zstd: 'Zstandard', gzip: 'gzip' }[r.compression] || 'None');
    if (r.compression) fact('Uncompressed', sizeLabel(r.dataSize));
    fact('Format', `${r.pointerSize * 8}-bit, ${r.endian}-endian`);
    fact('Data blocks', fmt.format(r.blockCount));
  }
  wrap.append(dl);

  if (r) {
    const inv = Object.entries(r.inventory).filter(([k]) => !['Brushes'].includes(k)).sort((a, b) => b[1] - a[1]);
    if (inv.length) {
      const sec = document.createElement('div');
      sec.append(Object.assign(document.createElement('p'), { className: 'section-label', textContent: 'Data in this file' }));
      const d2 = document.createElement('dl');
      d2.className = 'facts';
      for (const [k, v] of inv) d2.append(Object.assign(document.createElement('dt'), { textContent: k }), Object.assign(document.createElement('dd'), { textContent: fmt.format(v) }));
      sec.append(d2);
      wrap.append(sec);
    }
    if (r.warnings.length) {
      const sec = document.createElement('div');
      sec.append(Object.assign(document.createElement('p'), { className: 'section-label', textContent: 'Preview limits for this file' }));
      const ul = document.createElement('ul');
      ul.className = 'warn';
      for (const w of r.warnings) ul.append(Object.assign(document.createElement('li'), { textContent: w }));
      sec.append(ul);
      wrap.append(sec);
    }
  }

  const again = document.createElement('button');
  again.type = 'button';
  again.className = 'link-btn';
  again.textContent = 'Load the sample scene';
  again.addEventListener('click', () => loadSample());
  wrap.append(again);
  wrap.append(Object.assign(document.createElement('p'), {
    className: 'hint',
    textContent: 'Files are read on this device and never uploaded. Opens .blend files from Blender 2.5 to 5.x, plus GLB, OBJ, FBX, STL and PLY exports.',
  }));
  root.append(wrap);
}

// ---------------------------------------------------------------- start with the sample
function loadSample() {
  const bin = atob(SAMPLE_BASE64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  openBuffer(SAMPLE_NAME, bytes.buffer);
}
resize();
loadSample();
