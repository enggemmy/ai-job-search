<title>Blend Pocket</title>
<meta name="theme-color" content="#17191c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Single dark theme on purpose: a 3D viewport reads best on a dark ground,
     the same convention Blender and every DCC app use. */
  :root {
    color-scheme: dark;
    --ground: #2a2c30;
    --chrome: #17191c;
    --raised: #212428;
    --raised-2: #2a2e33;
    --line: #353940;
    --text: #e9e6df;
    --muted: #9b9ea6;
    --faint: #6c7078;
    --accent: #f0a43a;
    --accent-ink: #1d1406;
    --warn: #e8b04b;
    --danger: #ef6b6b;
    --axis-x: #e5484d;
    --axis-y: #86c34a;
    --axis-z: #4d8ef0;
    --ui: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --sheet-peek: 64px;
    --radius: 10px;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--chrome);
    color: var(--text);
    font: 14px/1.45 var(--ui);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { height: 100%; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }

  /* Top bar */
  .bar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
    background: var(--chrome);
    border-bottom: 1px solid var(--line);
    min-width: 0;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
  .brand svg { width: 22px; height: 22px; }
  .file { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
  .file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .chip {
    font: 500 11px/1 var(--mono); letter-spacing: .02em;
    padding: 5px 7px; border-radius: 999px;
    background: var(--raised-2); color: var(--text); white-space: nowrap;
  }
  .btn-open {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 14px; border: 0; border-radius: 999px;
    background: var(--accent); color: var(--accent-ink); font-weight: 600;
    cursor: pointer; white-space: nowrap;
  }
  .btn-open { position: relative; overflow: hidden; }
  .btn-open svg { width: 16px; height: 16px; }
  .btn-open:active { transform: translateY(1px); }
  .btn-open:focus-within { outline: 2px solid var(--text); outline-offset: 2px; }
  .file-overlay {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; cursor: pointer; font-size: 100px; /* large font: the whole button is the tap target on every engine */
  }
  @media (max-width: 420px) { .brand span { display: none; } }

  /* Viewport */
  .stage { position: relative; min-height: 0; background: var(--ground); overflow: hidden; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #gizmo { position: absolute; left: 10px; top: 10px; width: 84px; height: 84px; pointer-events: none; }

  .rail {
    position: absolute; right: 12px; top: 12px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .tool {
    width: 52px; padding: 7px 0 5px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: color-mix(in srgb, var(--chrome) 88%, transparent);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    cursor: pointer;
  }
  .tool svg { width: 20px; height: 20px; }
  .tool small { font-size: 10px; line-height: 1; color: var(--muted); letter-spacing: .02em; }
  .tool[aria-pressed="true"] { border-color: var(--accent); }
  .tool[aria-pressed="true"] small { color: var(--accent); }
  .tool:active { background: var(--raised-2); }

  .toast {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    padding: 6px 12px; border-radius: 999px;
    background: var(--chrome); border: 1px solid var(--line);
    font-size: 12px; color: var(--text); pointer-events: none;
    opacity: 0; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }

  .status {
    position: absolute; inset: 0; display: grid; place-items: center;
    padding-inline: 24px; text-align: center; pointer-events: none;
  }
  .status-card {
    max-width: 30rem; padding: 18px 20px; border-radius: 14px;
    background: var(--chrome); border: 1px solid var(--line);
    pointer-events: auto;
  }
  .status-card h2 { margin: 0 0 6px; font-size: 16px; text-wrap: balance; }
  .status-card p { margin: 0; color: var(--muted); }
  .status-card.error h2 { color: var(--danger); }
  .status-card ol { margin: 8px 0 0; padding-left: 20px; color: var(--muted); text-align: left; display: grid; gap: 4px; }
  .status-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
  .status-actions a, .status-actions button {
    padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--raised); color: var(--text); text-decoration: none; font-weight: 600; cursor: pointer;
  }
  .status-actions .primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .share-url { margin-top: 10px; font: 12px var(--mono); color: var(--muted); word-break: break-all; user-select: all; -webkit-user-select: all; }
  .spinner {
    width: 26px; height: 26px; margin: 0 auto 10px;
    border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .drop {
    position: absolute; inset: 10px; border: 2px dashed var(--accent); border-radius: 16px;
    display: grid; place-items: center; font-weight: 600; font-size: 16px;
    background: color-mix(in srgb, var(--chrome) 70%, transparent);
  }

  /* Bottom sheet (phone) / side panel (wide) */
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: var(--sheet-peek);
    display: flex; flex-direction: column;
    background: var(--chrome); border-top: 1px solid var(--line);
    border-radius: 16px 16px 0 0;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    transition: height .25s ease;
  }
  .sheet.open { height: min(58%, 480px); }
  .sheet:not(.open) .tabs, .sheet:not(.open) .panel { visibility: hidden; }
  .sheet-head {
    flex: none; display: flex; flex-direction: column; align-items: stretch; gap: 8px;
    padding: 8px 16px 10px; border: 0; background: none; cursor: pointer; text-align: left;
  }
  .handle { width: 40px; height: 4px; border-radius: 2px; background: var(--line); align-self: center; }
  .summary { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .summary strong { font-weight: 600; }
  .summary .nums { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .tabs { flex: none; display: flex; gap: 4px; padding: 0 12px; border-bottom: 1px solid var(--line); }
  .tab {
    padding: 8px 10px; border: 0; background: none; cursor: pointer;
    color: var(--muted); font-weight: 600; font-size: 13px;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .panel { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 8px 16px; -webkit-overflow-scrolling: touch; }

  .ol-row { display: flex; align-items: center; gap: 2px; border-radius: 8px; }
  .ol-row.selected { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .ol-main {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;
    padding: 8px 8px; border: 0; background: none; cursor: pointer; text-align: left;
  }
  .ol-main svg { flex: none; width: 16px; height: 16px; color: var(--muted); }
  .ol-row.selected .ol-main svg { color: var(--accent); }
  .ol-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ol-meta { font: 11px var(--mono); color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ol-eye { flex: none; width: 36px; height: 36px; display: grid; place-items: center; border: 0; background: none; cursor: pointer; color: var(--muted); border-radius: 8px; }
  .ol-eye svg { width: 18px; height: 18px; }
  .ol-row.hidden .ol-name, .ol-row.hidden .ol-main svg { opacity: .4; }
  .ol-row.hidden .ol-eye { color: var(--faint); }
  .ol-empty { padding: 16px 8px; color: var(--muted); }

  .info { display: grid; gap: 16px; padding: 8px; }
  .thumb { display: flex; gap: 14px; align-items: center; }
  .thumb canvas { width: 96px; height: auto; border-radius: 8px; background: var(--raised); flex: none; image-rendering: auto; }
  .thumb p { margin: 0; color: var(--muted); font-size: 13px; }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; font: 12.5px/1.5 var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
  .section-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 0 0 6px; }
  .warn { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .warn li { padding: 8px 10px; border-radius: 8px; background: color-mix(in srgb, var(--warn) 12%, transparent); color: var(--text); font-size: 13px; border-left: 3px solid var(--warn); }
  .link-btn { justify-self: start; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--raised); cursor: pointer; }
  .hint { color: var(--faint); font-size: 12px; margin: 0; }

  /* Render settings dialog and result view */
  .modal {
    position: fixed; inset: 0; z-index: 20;
    display: grid; align-items: end; justify-items: center;
    background: color-mix(in srgb, #000 55%, transparent);
    padding-inline: 0;
  }
  .modal-card {
    width: 100%; max-width: 30rem; max-height: 92%;
    overflow-y: auto; overscroll-behavior: contain;
    background: var(--chrome); border: 1px solid var(--line); border-bottom: 0;
    border-radius: 18px 18px 0 0;
    padding: 18px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    display: grid; gap: 14px;
  }
  .modal-card h2 { margin: 0; font-size: 18px; }
  .modal-card .sub { margin: -8px 0 0; color: var(--muted); font-size: 13px; }
  .field { display: grid; gap: 6px; margin: 0; padding: 0; border: 0; min-width: 0; }
  .field legend, .field > label { padding: 0; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-bottom: 6px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg label { position: relative; flex: 1 1 auto; min-width: 0; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span {
    display: block; text-align: center; padding: 9px 10px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--raised); cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px;
  }
  .seg small { display: block; font-size: 11px; color: var(--muted); }
  .seg input:checked + span { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--raised)); }
  .seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .seg input:disabled + span { opacity: .4; cursor: not-allowed; }
  .field select {
    font: inherit; color: var(--text); background: var(--raised); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 10px; width: 100%;
  }
  .render-summary { font: 12.5px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .note { margin: 0; font-size: 12.5px; color: var(--muted); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .btn { padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--raised); color: var(--text); font-weight: 600; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn:disabled { opacity: .45; cursor: default; }

  .render-view {
    position: fixed; inset: 0; z-index: 30;
    display: grid; grid-template-rows: auto 1fr auto;
    background: #0e0f11;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .rv-head { display: grid; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--chrome); }
  .rv-title { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .rv-title strong { font-size: 15px; }
  .rv-title span { font: 12.5px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .progress { height: 4px; border-radius: 2px; background: var(--raised-2); overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s linear; }
  .rv-body { min-height: 0; display: grid; place-items: center; padding: 12px 16px; overflow: hidden; }
  .rv-body canvas {
    max-width: 100%; max-height: 100%; width: auto; height: auto; display: block;
    border-radius: 6px; box-shadow: 0 8px 40px #0008;
    /* chequerboard shows through transparent renders */
    background: repeating-conic-gradient(#2a2c30 0 25%, #1f2124 0 50%) 0 0 / 20px 20px;
  }
  .rv-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 12px 16px; background: var(--chrome); border-top: 1px solid var(--line); }

  @media (min-width: 900px) {
    .modal { align-items: center; padding-inline: 16px; }
    .modal-card { border-radius: 18px; border-bottom: 1px solid var(--line); }
  }

  @media (min-width: 900px) {
    .stage { margin-right: 340px; }
    .sheet:not(.open) .tabs, .sheet:not(.open) .panel { visibility: visible; }
    .sheet, .sheet.open {
      left: auto; right: -340px; top: 0; width: 340px; height: auto;
      border-radius: 0; border-top: 0; border-left: 1px solid var(--line);
    }
    .sheet-head { cursor: default; }
    .handle { display: none; }
    .stage { overflow: visible; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sheet, .toast { transition: none; }
    .spinner { animation-duration: 2.4s; }
  }
</style>

<div class="app">
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M12 2.8 20 7.4v9.2L12 21.2 4 16.6V7.4Z" stroke="var(--accent)"/>
        <path d="M4 7.4 12 12l8-4.6M12 12v9.2" stroke-opacity=".7"/>
      </svg>
      <span>Blend Pocket</span>
    </div>
    <div class="file">
      <span class="file-name" id="fileName">No file</span>
      <span class="chip" id="fileChip" hidden></span>
    </div>
    <!-- The file input itself covers the button: tapping it opens the native
         picker directly. A script-triggered input.click() on a hidden input is
         ignored by iOS Safari and many in-app web views. -->
    <label class="btn-open" id="openLabel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Open
      <input type="file" id="fileInput" class="file-overlay" aria-label="Open a .blend or 3D model file">
    </label>
  </header>

  <main class="stage" id="stage">
    <canvas id="view" aria-label="3D viewport. Drag to orbit, pinch to zoom, two-finger drag to pan."></canvas>
    <canvas id="gizmo" width="168" height="168" aria-hidden="true"></canvas>

    <div class="rail" role="toolbar" aria-label="Viewport">
      <button class="tool" id="frameBtn" type="button" title="Frame all (Home)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><circle cx="12" cy="12" r="3"/></svg>
        <small>Frame</small>
      </button>
      <button class="tool" id="shadeBtn" type="button" title="Shading: Solid, Material, Wireframe (Z)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor" fill-opacity=".35"/></svg>
        <small id="shadeLabel">Material</small>
      </button>
      <button class="tool" id="viewBtn" type="button" title="Cycle view: Front (1), Right (3), Top (7), Perspective (5)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
        <small id="viewLabel">Persp</small>
      </button>
      <button class="tool" id="smoothBtn" type="button" title="Normals: Auto (as saved in Blender), Flat, Smooth">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 18c3-9 13-9 16 0"/><path d="M4 18h16" stroke-opacity=".5"/></svg>
        <small id="smoothLabel">Auto</small>
      </button>
      <button class="tool" id="renderBtn" type="button" title="Render an image (F12)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l2-2.5h6L17 8h3v11H4Z"/><circle cx="12" cy="13" r="3.6"/></svg>
        <small>Render</small>
      </button>
      <button class="tool" id="gridBtn" type="button" aria-pressed="true" title="Floor grid">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
        <small>Grid</small>
      </button>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="status" id="status" hidden></div>
    <div class="drop" id="drop" hidden>Drop a .blend file to open it</div>

    <section class="sheet" id="sheet" aria-label="Scene">
      <button class="sheet-head" id="sheetToggle" type="button" aria-expanded="false" aria-controls="sheetBody">
        <span class="handle" aria-hidden="true"></span>
        <span class="summary"><strong id="sumTitle">Scene</strong><span class="nums" id="sumNums">—</span></span>
      </button>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tabOutliner" aria-selected="true" aria-controls="outliner" type="button">Outliner</button>
        <button class="tab" role="tab" id="tabFile" aria-selected="false" aria-controls="fileInfo" type="button">File</button>
      </div>
      <div class="panel" id="outliner" role="tabpanel" aria-labelledby="tabOutliner"></div>
      <div class="panel" id="fileInfo" role="tabpanel" aria-labelledby="tabFile" hidden></div>
    </section>
  </main>
</div>

<div class="modal" id="renderPanel" hidden role="dialog" aria-modal="true" aria-labelledby="renderTitle">
  <form class="modal-card" id="renderForm">
    <h2 id="renderTitle">Render</h2>
    <p class="sub" id="renderSub">Make a finished image of the scene.</p>

    <fieldset class="field">
      <legend>Engine</legend>
      <div class="seg">
        <label><input type="radio" name="engine" id="engPath" value="path" checked><span>Path traced<small>Real shadows and bounce light</small></span></label>
        <label><input type="radio" name="engine" id="engFast" value="fast"><span>Fast<small>Instant, shadow maps</small></span></label>
      </div>
    </fieldset>

    <fieldset class="field">
      <legend>Camera</legend>
      <div class="seg">
        <label><input type="radio" name="camera" id="camScene" value="scene"><span id="camSceneLabel">Scene camera</span></label>
        <label><input type="radio" name="camera" id="camView" value="view" checked><span>This view</span></label>
      </div>
    </fieldset>

    <fieldset class="field">
      <legend>Lighting</legend>
      <div class="seg">
        <label><input type="radio" name="lighting" id="lightFile" value="file"><span id="lightFileLabel">From file</span></label>
        <label><input type="radio" name="lighting" id="lightStudio" value="studio" checked><span>Studio</span></label>
      </div>
    </fieldset>

    <div class="field">
      <label for="renderSize">Size</label>
      <select id="renderSize">
        <option value="640">Draft (640 px)</option>
        <option value="1280" selected>Standard (1280 px)</option>
        <option value="1920">High (1920 px)</option>
        <option value="file" id="sizeFileOpt">As set in Blender</option>
      </select>
    </div>

    <fieldset class="field" id="samplesField">
      <legend>Samples</legend>
      <div class="seg">
        <label><input type="radio" name="samples" id="spp16" value="16"><span>16</span></label>
        <label><input type="radio" name="samples" id="spp64" value="64" checked><span>64</span></label>
        <label><input type="radio" name="samples" id="spp256" value="256"><span>256</span></label>
        <label><input type="radio" name="samples" id="spp1024" value="1024"><span>1024</span></label>
      </div>
    </fieldset>

    <fieldset class="field">
      <legend>Background</legend>
      <div class="seg">
        <label><input type="radio" name="background" id="bgWorld" value="world" checked><span>World colour</span></label>
        <label><input type="radio" name="background" id="bgClear" value="transparent"><span>Transparent</span></label>
      </div>
    </fieldset>

    <p class="render-summary" id="renderSummary"></p>
    <p class="note" id="renderNote" hidden></p>
    <div class="modal-actions">
      <button type="button" class="btn" id="renderCancel">Cancel</button>
      <button type="submit" class="btn primary" id="renderGo">Render</button>
    </div>
  </form>
</div>

<div class="render-view" id="renderView" hidden role="dialog" aria-modal="true" aria-labelledby="rvTitle">

<script>
  // Startup check. If the viewer module fails to load (CDN blocked, offline,
  // or a browser without import maps), say so instead of leaving a dead UI.
  (function () {
    function fail(why) {
      if (window.__blendPocketReady) return;
      var el = document.getElementById('status');
      el.hidden = false;
      el.innerHTML = '<div class="status-card error"><h2>The 3D viewer didn\u2019t start</h2><p></p></div>';
      el.querySelector('p').textContent = why;
    }
    window.addEventListener('error', function (e) {
      var src = e && e.target && (e.target.src || e.target.href);
      if (src && /jsdelivr/.test(src)) fail('Couldn\u2019t download the 3D engine from cdn.jsdelivr.net. Check your connection, or whether your network blocks that site, then reload.');
    }, true);
    if (!(HTMLScriptElement.supports && HTMLScriptElement.supports('importmap'))) {
      fail('This browser is too old for the viewer. Update iOS/Safari (16.4 or newer) or use a current Chrome, then reload.');
    }
    setTimeout(function () { fail('The viewer is taking too long to load. Check your connection and reload. If you are inside an app, try opening this page in Safari or Chrome.'); }, 15000);
  })();
</script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "fzstd": "https://cdn.jsdelivr.net/npm/fzstd@0.1.1/+esm",
    "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.8.3/build/index.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { decompress as zstdDecompress } from 'fzstd';
import { parseBlend } from './blend-parser.js';
import { SAMPLE_NAME, SAMPLE_BASE64 } from './sample-blend.js';

window.__blendPocketReady = true;

// Blender is Z-up; keep its coordinates as-is and make three.js Z-up instead.
THREE.Object3D.DEFAULT_UP.set(0, 0, 1);

const $ = (id) => document.getElementById(id);
// Public link to this page, filled in at build time for hosted copies (see tools/build.mjs --share-url).
const SHARE_URL = '';
const IN_ANDROID_WEBVIEW = /; wv\)/.test(navigator.userAgent);
const fmt = new Intl.NumberFormat();
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------------------------------------------------------------- renderer
const canvas = $('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.setClearColor(0x2a2c30);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
scene.add(new THREE.HemisphereLight(0xe6ecff, 0x3a3430, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(4, -6, 9);
scene.add(key);
const rim = new THREE.DirectionalLight(0xbfd4ff, 0.6);
rim.position.set(-6, 5, 3);
scene.add(rim);

const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 1000);
camera.position.set(7.4, -6.9, 5);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = !reduceMotion;
controls.dampingFactor = 0.12;
controls.screenSpacePanning = true;

// Floor grid on the XY plane plus the red X / green Y axis lines Blender draws.
const grid = new THREE.Group();
function buildGrid(size) {
  grid.clear();
  const step = Math.pow(10, Math.floor(Math.log10(Math.max(size, 0.1))));
  const half = Math.ceil(size / step) * step * 2;
  const g = new THREE.GridHelper(half * 2, Math.round((half * 2) / step), 0x3a3e45, 0x33363c);
  g.rotation.x = Math.PI / 2;
  g.material.transparent = true;
  g.material.opacity = 0.9;
  grid.add(g);
  const axis = (a, b, color) => {
    const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
    grid.add(new THREE.Line(geo, new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.8 })));
  };
  axis(new THREE.Vector3(-half * 2, 0, 0), new THREE.Vector3(half * 2, 0, 0), 0xb13a3e);
  axis(new THREE.Vector3(0, -half * 2, 0), new THREE.Vector3(0, half * 2, 0), 0x6c9a3c);
}
buildGrid(5);
scene.add(grid);

const content = new THREE.Group();
scene.add(content);

let needsRender = true;
const requestRender = () => { needsRender = true; };
controls.addEventListener('change', requestRender);

// On phones the bottom sheet covers part of the canvas. Shift the projection
// centre up so framed models sit in the visible area instead of under the sheet.
let coveredPx = 0;
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  const sheet = document.getElementById('sheet');
  const sr = sheet.getBoundingClientRect(), cr = canvas.getBoundingClientRect();
  coveredPx = Math.max(0, Math.min(h * 0.7, cr.bottom - Math.max(sr.top, cr.top)));
  if (sr.left >= cr.right - 1) coveredPx = 0; // side panel layout
  camera.aspect = w / h;
  if (coveredPx) camera.setViewOffset(w, h, 0, coveredPx / 2, w, h); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  requestRender();
}
new ResizeObserver(resize).observe(canvas);
document.getElementById('sheet').addEventListener('transitionend', resize);

let tween = null;
function loop(t) {
  requestAnimationFrame(loop);
  if (tween) {
    const k = Math.min(1, (t - tween.t0) / tween.dur);
    const e = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.c0, tween.c1, e);
    if (k >= 1) tween = null;
    needsRender = true;
  }
  if (controls.update()) needsRender = true;
  if (needsRender) {
    needsRender = false;
    renderer.render(scene, camera);
    drawGizmo();
  }
}
requestAnimationFrame(loop);

// ---------------------------------------------------------------- axis gizmo
const gctx = $('gizmo').getContext('2d');
const AXES = [
  { v: new THREE.Vector3(1, 0, 0), label: 'X', color: '#e5484d' },
  { v: new THREE.Vector3(0, 1, 0), label: 'Y', color: '#86c34a' },
  { v: new THREE.Vector3(0, 0, 1), label: 'Z', color: '#4d8ef0' },
];
function drawGizmo() {
  const s = 168, c = s / 2, r = 54;
  gctx.clearRect(0, 0, s, s);
  const q = camera.quaternion.clone().invert();
  const pts = [];
  for (const a of AXES) {
    const p = a.v.clone().applyQuaternion(q);
    pts.push({ ...a, x: c + p.x * r, y: c - p.y * r, z: p.z, pos: true });
    pts.push({ ...a, x: c - p.x * r, y: c + p.y * r, z: -p.z, pos: false });
  }
  pts.sort((a, b) => a.z - b.z);
  for (const p of pts) {
    if (p.pos) {
      gctx.strokeStyle = p.color; gctx.lineWidth = 4;
      gctx.beginPath(); gctx.moveTo(c, c); gctx.lineTo(p.x, p.y); gctx.stroke();
    }
    gctx.beginPath(); gctx.arc(p.x, p.y, p.pos ? 15 : 11, 0, Math.PI * 2);
    gctx.fillStyle = p.pos ? p.color : p.color + '55';
    gctx.fill();
    if (p.pos) {
      gctx.fillStyle = '#17191c'; gctx.font = '700 17px Figtree, system-ui, sans-serif';
      gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
      gctx.fillText(p.label, p.x, p.y + 1);
    }
  }
}

// ---------------------------------------------------------------- scene state
const state = {
  entries: [],          // { name, typeName, parent, object3d, mesh?, meta, hidden }
  selected: null,
  shading: 'material',  // solid | material | wire
  normals: 'auto',      // auto (per mesh, as saved) | flat | smooth
  viewIndex: 0,
};

const solidMat = new THREE.MeshStandardMaterial({ color: 0xc9cacd, roughness: 0.62, metalness: 0, flatShading: true, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1, side: THREE.DoubleSide });
const hiddenMat = new THREE.MeshBasicMaterial({ visible: false });
const wireMat = new THREE.LineBasicMaterial({ color: 0xc4c7cd });
const selectMat = new THREE.LineBasicMaterial({ color: 0xf0a43a });
const helperMat = new THREE.LineBasicMaterial({ color: 0x8d9199 });

function makeSlotMaterial(m) {
  const mat = new THREE.MeshStandardMaterial({
    color: 0xc9cacd, roughness: 0.5, metalness: 0, flatShading: true, side: THREE.DoubleSide,
    polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
  });
  if (m) {
    // Blender stores viewport colours in scene-linear space.
    mat.color.setRGB(m.color[0], m.color[1], m.color[2], THREE.LinearSRGBColorSpace);
    mat.metalness = m.metallic;
    mat.roughness = m.roughness;
    if (m.alpha < 0.999) { mat.transparent = true; mat.opacity = m.alpha; }
  }
  return mat;
}

function applyShading() {
  for (const e of state.entries) {
    const o = e.object3d;
    if (!o || !o.isMesh) continue;
    o.material = state.shading === 'wire' ? hiddenMat : state.shading === 'solid' ? solidMat : o.userData.slotMats;
    const flat = state.normals === 'auto' ? o.userData.autoFlat : state.normals === 'flat';
    if (state.shading === 'solid') o.material = o.userData.solidMat;
    for (const m of (Array.isArray(o.material) ? o.material : [o.material])) {
      if ('flatShading' in m && m.flatShading !== flat) { m.flatShading = flat; m.needsUpdate = true; }
    }
    let wire = o.getObjectByName('wire');
    if (state.shading === 'wire' && !wire) {
      wire = new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry, 1), wireMat);
      wire.name = 'wire';
      o.add(wire);
    }
    if (wire) wire.visible = state.shading === 'wire';
  }
  $('shadeLabel').textContent = { solid: 'Solid', material: 'Material', wire: 'Wire' }[state.shading];
  $('smoothLabel').textContent = { auto: 'Auto', flat: 'Flat', smooth: 'Smooth' }[state.normals];
  requestRender();
}

function clearScene() {
  content.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    const mats = o.userData.slotMats;
    if (mats) [].concat(mats).forEach((m) => m.dispose());
    if (o.userData.solidMat) o.userData.solidMat.dispose();
    for (const parts of Object.values(o.userData.renderGeo || {})) for (const p of parts) p.geometry.dispose();
  });
  content.clear();
  state.entries = [];
  state.selected = null;
  state.blend = null;
}

// Small wire glyphs for cameras, lights and empties so the layout reads.
function helperFor(typeName) {
  const pts = [];
  if (typeName === 'Camera') {
    const c = [[-0.5, -0.32, -1], [0.5, -0.32, -1], [0.5, 0.32, -1], [-0.5, 0.32, -1]];
    for (let i = 0; i < 4; i++) pts.push(0, 0, 0, ...c[i], ...c[i], ...c[(i + 1) % 4]);
    pts.push(-0.3, 0.4, -1, 0, 0.6, -1, 0, 0.6, -1, 0.3, 0.4, -1, 0.3, 0.4, -1, -0.3, 0.4, -1);
  } else if (typeName === 'Light') {
    const n = 16;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2, b = ((i + 1) / n) * Math.PI * 2;
      pts.push(Math.cos(a) * 0.15, Math.sin(a) * 0.15, 0, Math.cos(b) * 0.15, Math.sin(b) * 0.15, 0);
    }
    pts.push(0, 0, 0, 0, 0, -1);
  } else {
    pts.push(-0.4, 0, 0, 0.4, 0, 0, 0, -0.4, 0, 0, 0.4, 0, 0, 0, -0.4, 0, 0, 0.4);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  return new THREE.LineSegments(g, helperMat);
}

// ---------------------------------------------------------------- .blend → three.js
function buildFromBlend(result) {
  const geoCache = new Map();
  for (const o of result.objects) {
    let obj;
    let meta = o.typeName;
    if (o.mesh) {
      const m = o.mesh;
      let geo = geoCache.get(m);
      if (!geo) {
        geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(m.positions, 3));
        geo.setIndex(new THREE.BufferAttribute(m.indices, 1));
        geo.computeVertexNormals();
        geo.computeBoundingSphere();
        geoCache.set(m, geo);
      }
      const slotMats = (m.materials.length ? m.materials : [null]).map(makeSlotMaterial);
      geo.clearGroups();
      for (const g of m.groups) geo.addGroup(g.start, g.count, Math.min(g.materialIndex, slotMats.length - 1));
      obj = new THREE.Mesh(geo, slotMats);
      obj.userData.slotMats = slotMats;
      obj.userData.solidMat = solidMat.clone();
      obj.userData.autoFlat = m.smoothRatio < 0.5;
      meta = `${fmt.format(m.vertCount)} v · ${fmt.format(m.faceCount)} f`;
    } else {
      obj = helperFor(o.typeName);
    }
    obj.matrixAutoUpdate = false;
    obj.matrix.fromArray(o.matrix);
    obj.name = o.name;
    content.add(obj);
    state.entries.push({ name: o.name, typeName: o.typeName, parent: o.parent, object3d: obj, meta, mesh: o.mesh, modifiers: o.hasModifiers, hidden: false, src: o });
  }
  content.updateMatrixWorld(true);
}

// ---------------------------------------------------------------- other formats
const Y_UP = new Set(['glb', 'gltf', 'obj', 'fbx']);
async function loadOther(ext, buffer) {
  let root;
  if (ext === 'glb' || ext === 'gltf') {
    const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
    root = await new Promise((res, rej) => new GLTFLoader().parse(buffer, '', (g) => res(g.scene), rej));
  } else if (ext === 'obj') {
    const { OBJLoader } = await import('three/addons/loaders/OBJLoader.js');
    root = new OBJLoader().parse(new TextDecoder().decode(buffer));
  } else if (ext === 'fbx') {
    const { FBXLoader } = await import('three/addons/loaders/FBXLoader.js');
    root = new FBXLoader().parse(buffer, '');
  } else if (ext === 'stl' || ext === 'ply') {
    const mod = ext === 'stl' ? await import('three/addons/loaders/STLLoader.js') : await import('three/addons/loaders/PLYLoader.js');
    const Loader = ext === 'stl' ? mod.STLLoader : mod.PLYLoader;
    const geo = new Loader().parse(buffer);
    if (!geo.attributes.normal) geo.computeVertexNormals();
    root = new THREE.Mesh(geo);
    root.name = 'Mesh';
  }
  if (Y_UP.has(ext)) root.rotation.x = Math.PI / 2;
  root.updateMatrixWorld(true);
  let i = 0;
  root.traverse((o) => {
    if (!o.isMesh) return;
    const src = Array.isArray(o.material) ? o.material : [o.material];
    const slotMats = src.map((m) => {
      if (m && m.isMeshStandardMaterial) { m.flatShading = true; m.side = THREE.DoubleSide; return m; }
      const s = makeSlotMaterial(null);
      if (m && m.color) s.color.copy(m.color);
      if (m && m.map) s.map = m.map;
      return s;
    });
    o.userData.slotMats = Array.isArray(o.material) ? slotMats : slotMats[0];
    o.userData.solidMat = solidMat.clone();
    o.userData.autoFlat = false; // exports carry their own normals
    const pos = o.geometry.attributes.position;
    const tris = o.geometry.index ? o.geometry.index.count / 3 : pos.count / 3;
    state.entries.push({ name: o.name || `Mesh ${++i}`, typeName: 'Mesh', parent: null, object3d: o, mesh: { vertCount: pos.count, triCount: tris }, meta: `${fmt.format(pos.count)} v · ${fmt.format(tris)} tris`, hidden: false });
  });
  content.add(root);
  content.updateMatrixWorld(true);
}

// ---------------------------------------------------------------- loading
let loadToken = 0;
function showStatus(kind, title, text) {
  const el = $('status');
  if (!kind) { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  el.innerHTML = '';
  const card = document.createElement('div');
  card.className = `status-card ${kind}`;
  if (kind === 'busy') card.append(Object.assign(document.createElement('div'), { className: 'spinner' }));
  card.append(Object.assign(document.createElement('h2'), { textContent: title }));
  if (text) card.append(Object.assign(document.createElement('p'), { textContent: text }));
  el.append(card);
}

const sizeLabel = (n) => (n >= 1 << 20 ? `${(n / (1 << 20)).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`);
const nextFrame = () => new Promise((r) => setTimeout(r, 30));

async function openBuffer(name, buffer) {
  const token = ++loadToken;
  const ext = (name.split('.').pop() || '').toLowerCase().replace(/\d+$/, '');
  showStatus('busy', `Opening ${name}`, `Reading ${sizeLabel(buffer.byteLength)}…`);
  await nextFrame();
  try {
    let result = null;
    const head = new Uint8Array(buffer, 0, Math.min(8, buffer.byteLength));
    const looksBlend = ext === 'blend' || String.fromCharCode(...head.subarray(0, 7)) === 'BLENDER' || (head[0] === 0x28 && head[1] === 0xb5) || (head[0] === 0x1f && head[1] === 0x8b);
    if (looksBlend) {
      result = await parseBlend(buffer, { zstdDecompress });
      if (token !== loadToken) return;
      clearScene();
      state.blend = result;
      buildFromBlend(result);
    } else if (['glb', 'gltf', 'obj', 'fbx', 'stl', 'ply'].includes(ext)) {
      clearScene();
      await loadOther(ext, buffer);
    } else {
      throw new Error(`".${ext}" files are not supported. Open a .blend file, or a GLB, OBJ, FBX, STL or PLY export.`);
    }
    if (token !== loadToken) return;
    showStatus(null);
    $('fileName').textContent = name;
    const chip = $('fileChip');
    chip.hidden = false;
    chip.textContent = result ? `Blender ${result.version}` : ext.toUpperCase();
    applyShading();
    fitGrid();
    setView(0, false);
    frameAll(false);
    renderOutliner();
    renderFileInfo(name, buffer.byteLength, result);
    const meshes = state.entries.filter((e) => e.mesh);
    if (!meshes.length) showStatus('error', 'No meshes to draw', 'This file opened, but it has no mesh objects the viewer can draw. The File tab lists what it contains.');
  } catch (err) {
    if (token !== loadToken) return;
    console.error(err);
    showStatus('error', `Couldn't open ${name}`, err.message || String(err));
  }
}

async function openFile(file) {
  if (!file) return;
  try {
    const buffer = await file.arrayBuffer();
    await openBuffer(file.name, buffer);
  } catch (err) {
    showStatus('error', `Couldn't read ${file.name}`, 'The browser could not read this file. It may be too large for this device’s memory.');
  }
}

$('fileInput').addEventListener('change', (e) => { pickerSeen = true; openFile(e.target.files[0]); e.target.value = ''; });

// Some Android in-app browsers (WebViews) never show a file picker, and a web
// page cannot override that. Detect "tapped Open, but no picker appeared" by
// watching for the page losing focus or visibility, and offer a way out.
let pickerSeen = true;
let pickerTimer;
const markPicker = () => { pickerSeen = true; };
addEventListener('blur', markPicker);
addEventListener('pagehide', markPicker);
document.addEventListener('visibilitychange', () => { if (document.hidden) markPicker(); });
$('fileInput').addEventListener('cancel', markPicker);
$('fileInput').addEventListener('click', () => {
  pickerSeen = false;
  clearTimeout(pickerTimer);
  pickerTimer = setTimeout(() => { if (!pickerSeen) showPickerHelp(); }, 1500);
});

function showPickerHelp() {
  const el = $('status');
  el.hidden = false;
  el.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'status-card';
  card.append(Object.assign(document.createElement('h2'), { textContent: 'No file picker appeared?' }));
  card.append(Object.assign(document.createElement('p'), {
    textContent: IN_ANDROID_WEBVIEW || !SHARE_URL
      ? 'The app you opened this page in blocks file pickers. Web pages can\u2019t change that. Open the page in Chrome instead:'
      : 'Your browser blocked the file picker for this page. Open it in Chrome instead:',
  }));
  const steps = document.createElement('ol');
  const items = SHARE_URL
    ? ['Tap \u201cOpen in Chrome\u201d below. If it opens inside the app again, use \u201cCopy link\u201d.', 'Paste the link into Chrome and sign in to claude.ai if asked.', 'Tap Open and choose your .blend file.']
    : ['In the app\u2019s menu (\u22ee), choose \u201cOpen in browser\u201d or \u201cOpen in Chrome\u201d.', 'Tap Open and choose your .blend file.'];
  for (const t of items) steps.append(Object.assign(document.createElement('li'), { textContent: t }));
  card.append(steps);
  const actions = document.createElement('div');
  actions.className = 'status-actions';
  if (SHARE_URL) {
    // intent: URLs hand the link to Chrome itself on Android; elsewhere use the plain link.
    const android = /Android/i.test(navigator.userAgent);
    const href = android
      ? `intent://${SHARE_URL.replace(/^https?:\/\//, '')}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${encodeURIComponent(SHARE_URL)};end`
      : SHARE_URL;
    actions.append(Object.assign(document.createElement('a'), { className: 'primary', href, target: '_blank', rel: 'noopener', textContent: 'Open in Chrome' }));
    const copy = Object.assign(document.createElement('button'), { type: 'button', textContent: 'Copy link' });
    copy.addEventListener('click', () => {
      navigator.clipboard.writeText(SHARE_URL)
        .then(() => { copy.textContent = 'Copied'; })
        .catch(() => { const r = document.createRange(); r.selectNodeContents(url); getSelection().removeAllRanges(); getSelection().addRange(r); copy.textContent = 'Select and copy the link below'; });
    });
    actions.append(copy);
  }
  const close = Object.assign(document.createElement('button'), { type: 'button', textContent: 'Close' });
  close.addEventListener('click', () => showStatus(null));
  actions.append(close);
  card.append(actions);
  const url = Object.assign(document.createElement('div'), { className: 'share-url', textContent: SHARE_URL });
  if (SHARE_URL) card.append(url);
  el.append(card);
}

let dragDepth = 0;
addEventListener('dragenter', (e) => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { dragDepth++; $('drop').hidden = false; e.preventDefault(); } });
addEventListener('dragover', (e) => e.preventDefault());

// ---------------------------------------------------------------- camera
const VIEWS = [
  { label: 'Persp', dir: new THREE.Vector3(0.66, -0.62, 0.42) },
  { label: 'Front', dir: new THREE.Vector3(0, -1, 0) },
  { label: 'Right', dir: new THREE.Vector3(1, 0, 0) },
  { label: 'Top', dir: new THREE.Vector3(0, -1e-4, 1) },
];

function visibleBox(entries) {
  const box = new THREE.Box3();
  for (const e of entries) if (e.mesh && !e.hidden) box.expandByObject(e.object3d);
  if (box.isEmpty()) for (const e of entries) if (!e.hidden) box.expandByObject(e.object3d);
  if (box.isEmpty()) box.setFromCenterAndSize(new THREE.Vector3(), new THREE.Vector3(2, 2, 2));
  return box;
}

function moveCamera(target, dir, dist, animate = true) {
  const p1 = target.clone().addScaledVector(dir.clone().normalize(), dist);
  camera.near = Math.max(dist / 1000, 1e-4);
  camera.far = dist * 100;
  camera.updateProjectionMatrix();
  if (!animate || reduceMotion) {
    tween = null;
    camera.position.copy(p1);
    controls.target.copy(target);
    controls.update();
  } else {
    tween = { t0: performance.now(), dur: 380, p0: camera.position.clone(), p1, c0: controls.target.clone(), c1: target.clone() };
  }
  requestRender();
}

function frameBox(box, animate = true) {
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  const r = Math.max(sphere.radius, 1e-3);
  const fov = THREE.MathUtils.degToRad(camera.fov);
  const h = canvas.clientHeight || 1;
  const visible = Math.max(0.3, (h - coveredPx) / h);
  const vfov = 2 * Math.atan(Math.tan(fov / 2) * visible);
  const fit = Math.min(vfov, 2 * Math.atan(Math.tan(fov / 2) * camera.aspect));
  const dist = (r / Math.sin(fit / 2)) * 1.05;
  const dir = camera.position.clone().sub(controls.target);
  moveCamera(sphere.center, dir.lengthSq() ? dir : VIEWS[0].dir, dist, animate);
}
const frameAll = (animate = true) => frameBox(visibleBox(state.entries), animate);
const frameSelected = () => state.selected && frameBox(visibleBox([state.selected]));

function setView(i, animate = true) {
  state.viewIndex = i;
  const dist = camera.position.distanceTo(controls.target) || 10;
  moveCamera(controls.target.clone(), VIEWS[i].dir, dist, animate);
  $('viewLabel').textContent = VIEWS[i].label;
}

function fitGrid() {
  const box = visibleBox(state.entries);
  const size = box.getSize(new THREE.Vector3());
  buildGrid(Math.max(size.x, size.y, 1));
}

// ---------------------------------------------------------------- selection
function select(entry, { frame = false } = {}) {
  if (state.selected?.object3d) {
    const old = state.selected.object3d.getObjectByName('selection');
    if (old) { old.geometry.dispose(); old.removeFromParent(); }
  }
  state.selected = entry && state.selected !== entry ? entry : entry && frame ? entry : null;
  if (state.selected?.object3d?.isMesh) {
    const lines = new THREE.LineSegments(new THREE.EdgesGeometry(state.selected.object3d.geometry, 30), selectMat);
    lines.name = 'selection';
    state.selected.object3d.add(lines);
  }
  if (frame && state.selected) frameSelected();
  document.querySelectorAll('.ol-row').forEach((r) => r.classList.toggle('selected', r.dataset.name === state.selected?.name));
  requestRender();
}

const raycaster = new THREE.Raycaster();
let down = null;
canvas.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6 || performance.now() - down.t > 400) return;
  const r = canvas.getBoundingClientRect();
  raycaster.setFromCamera(new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
  const meshes = state.entries.filter((x) => x.mesh && !x.hidden).map((x) => x.object3d);
  const hit = raycaster.intersectObjects(meshes, false)[0];
  const entry = hit && state.entries.find((x) => x.object3d === hit.object);
  if (entry) select(entry); else if (state.selected) select(null);
});

// Blender's numpad conventions on desktop keyboards.
addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, select') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (!$('renderPanel').hidden || !$('renderView').hidden) {
    if (e.key === 'Escape') { if (!$('renderView').hidden) closeRenderView(); else closeRenderPanel(); }
    return;
  }
  const k = e.code;
  if (k === 'Numpad1' || e.key === '1') setView(1);
  else if (k === 'Numpad3' || e.key === '3') setView(2);
  else if (k === 'Numpad7' || e.key === '7') setView(3);
  else if (k === 'Numpad5' || e.key === '5') setView(0);
  else if (k === 'Home') frameAll();
  else if (k === 'NumpadDecimal' || e.key === '.') frameSelected();
  else if (e.key === 'z' || e.key === 'Z') cycleShading();
  else if (k === 'F12') openRenderPanel();
  else return;
  e.preventDefault();
});

function renderOutliner() {
  const root = $('outliner');
  root.innerHTML = '';
  const meshes = state.entries.filter((e) => e.mesh);
  const verts = meshes.reduce((s, e) => s + e.mesh.vertCount, 0);
  const tris = meshes.reduce((s, e) => s + e.mesh.triCount, 0);
  $('sumTitle').textContent = `${state.entries.length} object${state.entries.length === 1 ? '' : 's'}`;
  $('sumNums').textContent = `${fmt.format(verts)} verts · ${fmt.format(tris)} tris`;
  if (!state.entries.length) {
    root.append(Object.assign(document.createElement('p'), { className: 'ol-empty', textContent: 'This file has no objects.' }));
    return;
  }
  const names = new Set(state.entries.map((e) => e.name));
  const children = new Map();
  for (const e of state.entries) {
    const p = e.parent && names.has(e.parent) ? e.parent : '';
    if (!children.has(p)) children.set(p, []);
    children.get(p).push(e);
  }
  const walk = (parent, depth) => {
    for (const e of (children.get(parent) || []).sort((a, b) => a.name.localeCompare(b.name))) {
      const row = document.createElement('div');
      row.className = 'ol-row' + (e.hidden ? ' hidden' : '') + (state.selected === e ? ' selected' : '');
      row.dataset.name = e.name;
      const main = document.createElement('button');
      main.type = 'button';
      main.className = 'ol-main';
      main.style.paddingLeft = `${8 + depth * 18}px`;
      main.innerHTML = ICONS[e.typeName] || ICONS.Other;
      main.append(
        Object.assign(document.createElement('span'), { className: 'ol-name', textContent: e.name }),
        Object.assign(document.createElement('span'), { className: 'ol-meta', textContent: e.meta }),
      );
      main.title = e.modifiers ? `${e.name} (modifiers not applied in preview)` : e.name;
      main.addEventListener('click', () => select(e, { frame: true }));
      const eye = document.createElement('button');
      eye.type = 'button';
      eye.className = 'ol-eye';
      eye.setAttribute('aria-label', `${e.hidden ? 'Show' : 'Hide'} ${e.name}`);
      eye.innerHTML = e.hidden ? EYE_OFF : EYE;
      eye.addEventListener('click', () => {
        e.hidden = !e.hidden;
        e.object3d.visible = !e.hidden;
        row.classList.toggle('hidden', e.hidden);
        eye.innerHTML = e.hidden ? EYE_OFF : EYE;
        eye.setAttribute('aria-label', `${e.hidden ? 'Show' : 'Hide'} ${e.name}`);
        requestRender();
      });
      row.append(main, eye);
      root.append(row);
      walk(e.name, depth + 1);
    }
  };
  walk('', 0);
}

// ---------------------------------------------------------------- rendering
// A Blender-style F12: build a separate scene from the file's camera, lights
// and world (or a studio setup), then either path trace it progressively or
// rasterise it once with shadow maps, on its own WebGL canvas.

const MAX_PIXELS = 3840 * 2160;

function sceneCameraEntry() {
  const id = state.blend?.scene?.cameraId;
  return id ? state.entries.find((e) => e.src?.id === id && e.src.camera && e.src.camera.type !== 'panoramic') : null;
}
function fileLights() {
  if (!state.blend || state.blend.legacyLightUnits) return [];
  return state.entries.filter((e) => e.src?.light && !e.hidden);
}

function renderSettings() {
  const v = (name) => document.querySelector(`#renderForm input[name="${name}"]:checked`)?.value;
  return {
    engine: v('engine'), camera: v('camera'), lighting: v('lighting'),
    samples: Number(v('samples')), background: v('background'), size: $('renderSize').value,
  };
}

function renderDimensions(opts) {
  let aspect;
  if (opts.camera === 'scene' && state.blend?.scene) {
    const [x, y] = state.blend.scene.resolution;
    aspect = x / y;
  } else {
    aspect = (canvas.clientWidth || 16) / (canvas.clientHeight || 9);
  }
  let w, h;
  if (opts.size === 'file' && state.blend?.scene) {
    const { resolution: [x, y], resolutionPercent: pct } = state.blend.scene;
    w = Math.round((x * pct) / 100);
    h = Math.round((y * pct) / 100);
    if (opts.camera !== 'scene') h = Math.round(w / aspect);
  } else {
    const long = Number(opts.size) || 1280;
    if (aspect >= 1) { w = long; h = Math.round(long / aspect); } else { h = long; w = Math.round(long * aspect); }
  }
  const k = Math.min(1, Math.sqrt(MAX_PIXELS / (w * h)));
  return { width: Math.max(16, Math.round(w * k)), height: Math.max(16, Math.round(h * k)), capped: k < 1 };
}

function refreshRenderPanel() {
  const opts = renderSettings();
  const cam = sceneCameraEntry();
  const lights = fileLights();
  const scene = state.blend?.scene;
  $('camScene').disabled = !cam;
  $('camSceneLabel').textContent = cam
    ? `${cam.name} · ${cam.src.camera.type === 'orthographic' ? 'ortho' : `${Math.round(cam.src.camera.lens)} mm`}`
    : 'Scene camera';
  $('lightFile').disabled = !lights.length;
  $('lightFileLabel').textContent = lights.length ? `From file · ${lights.length} light${lights.length === 1 ? '' : 's'}` : 'From file';
  const sizeOpt = $('sizeFileOpt');
  sizeOpt.disabled = !scene;
  sizeOpt.textContent = scene
    ? `As set in Blender (${Math.round((scene.resolution[0] * scene.resolutionPercent) / 100)} × ${Math.round((scene.resolution[1] * scene.resolutionPercent) / 100)})`
    : 'As set in Blender';
  if ($('camScene').disabled && $('camScene').checked) $('camView').checked = true;
  if ($('lightFile').disabled && $('lightFile').checked) $('lightStudio').checked = true;
  if (sizeOpt.disabled && $('renderSize').value === 'file') $('renderSize').value = '1280';
  $('samplesField').hidden = opts.engine !== 'path';
  const d = renderDimensions(renderSettings());
  const o = renderSettings();
  $('renderSummary').textContent = `${d.width} × ${d.height} px${o.engine === 'path' ? ` · ${o.samples} samples` : ''}${d.capped ? ' · capped at 4K' : ''}`;
  const notes = [];
  if (state.blend?.legacyLightUnits && state.entries.some((e) => e.src?.light)) notes.push('Lights in files from before Blender 2.80 use old units, so this file renders with studio lighting.');
  if (state.entries.some((e) => e.modifiers)) notes.push('Modifiers are not applied, so objects render as their base mesh.');
  $('renderNote').hidden = !notes.length;
  $('renderNote').textContent = notes.join(' ');
}

function openRenderPanel() {
  if (!state.entries.some((e) => e.mesh)) { toast('Open a file with meshes to render'); return; }

  $('renderPanel').hidden = false;
  $('renderGo').focus();
}

// Linear-light gradient environment (equirect) - Z-up worlds rotate it below.
function gradientEnvironment(top, bottom) {
  const w = 64, h = 32;
  const data = new Float32Array(w * h * 4);
  for (let y = 0; y < h; y++) {
    const t = Math.min(1, Math.max(0, (y / (h - 1) - 0.35) / 0.3)); // horizon band
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      data[i] = bottom.r + (top.r - bottom.r) * t;
      data[i + 1] = bottom.g + (top.g - bottom.g) * t;
      data[i + 2] = bottom.b + (top.b - bottom.b) * t;
      data[i + 3] = 1;
    }
  }
  const tex = new THREE.DataTexture(data, w, h, THREE.RGBAFormat, THREE.FloatType);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.magFilter = tex.minFilter = THREE.LinearFilter;
  tex.flipY = true;
  tex.needsUpdate = true;
  return tex;
}

// Render geometry: one non-indexed piece per material slot. The path tracer
// (three-gpu-pathtracer 0.0.23) maps materials per mesh, not per geometry
// group, so a multi-material mesh must be split for colours to land right.
function renderGeometry(mesh, flat) {
  const cache = (mesh.userData.renderGeo ||= {});
  const key = flat ? 'flat' : 'smooth';
  if (cache[key]) return cache[key];
  // Per-triangle vertices: the path tracer stores material ids per vertex, so
  // shared corners between faces of different materials must be split.
  let g = mesh.geometry;
  if (g.index) {
    if (!flat && !g.attributes.normal) g.computeVertexNormals();
    g = g.toNonIndexed();
  } else {
    g = g.clone();
  }
  if (flat || !g.attributes.normal) g.computeVertexNormals();
  const groups = g.groups.length ? g.groups : [{ start: 0, count: g.attributes.position.count, materialIndex: 0 }];
  if (groups.length === 1) {
    g.clearGroups();
    return (cache[key] = [{ geometry: g, materialIndex: groups[0].materialIndex }]);
  }
  const parts = groups.map(({ start, count, materialIndex }) => {
    const part = new THREE.BufferGeometry();
    for (const [name, attr] of Object.entries(g.attributes)) {
      const n = attr.itemSize;
      part.setAttribute(name, new THREE.BufferAttribute(attr.array.slice(start * n, (start + count) * n), n, attr.normalized));
    }
    return { geometry: part, materialIndex };
  });
  g.dispose();
  return (cache[key] = parts);
}

function buildRenderScene(opts, width, height) {
  const scene = new THREE.Scene();
  const disposables = [];
  const box = new THREE.Box3();

  for (const e of state.entries) {
    const src = e.object3d;
    if (!e.mesh || e.hidden || !src.isMesh || !src.visible) continue;
    const flat = state.normals === 'auto' ? src.userData.autoFlat : state.normals === 'flat';
    const mats = [].concat(src.userData.slotMats).map((m) => {
      const c = m.clone();
      c.flatShading = false;
      c.polygonOffset = false;
      c.side = THREE.DoubleSide;
      disposables.push(c);
      return c;
    });
    for (const part of renderGeometry(src, flat)) {
      const mesh = new THREE.Mesh(part.geometry, mats[Math.min(part.materialIndex, mats.length - 1)]);
      mesh.matrixAutoUpdate = false;
      mesh.matrix.copy(src.matrixWorld);
      mesh.castShadow = mesh.receiveShadow = true;
      scene.add(mesh);
      mesh.updateMatrixWorld(true);
      box.expandByObject(mesh);
    }
  }
  if (box.isEmpty()) box.setFromCenterAndSize(new THREE.Vector3(), new THREE.Vector3(2, 2, 2));
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  const center = sphere.center, radius = Math.max(sphere.radius, 0.01);

  // Camera
  const aspect = width / height;
  let cam;
  const sc = opts.camera === 'scene' ? sceneCameraEntry() : null;
  if (sc) {
    const c = sc.src.camera;
    const horizontalFit = c.sensorFit === 'horizontal' || (c.sensorFit === 'auto' && aspect >= 1);
    if (c.type === 'orthographic') {
      const half = c.orthoScale / 2;
      const hw = horizontalFit ? half : half * aspect;
      const hh = horizontalFit ? half / aspect : half;
      cam = new THREE.OrthographicCamera(-hw, hw, hh, -hh, c.clipStart, c.clipEnd);
    } else {
      const sensor = c.sensorFit === 'vertical' ? c.sensorY : c.sensorX;
      const halfAngle = Math.atan(sensor / 2 / c.lens);
      const vfov = horizontalFit ? 2 * Math.atan(Math.tan(halfAngle) / aspect) : 2 * halfAngle;
      cam = new THREE.PerspectiveCamera(THREE.MathUtils.radToDeg(vfov), aspect, c.clipStart, c.clipEnd);
    }
    const m = new THREE.Matrix4().fromArray(sc.src.matrix);
    const pos = new THREE.Vector3(), quat = new THREE.Quaternion(), scl = new THREE.Vector3();
    m.decompose(pos, quat, scl);
    cam.position.copy(pos);
    cam.quaternion.copy(quat);
    if (c.shiftX || c.shiftY) {
      const big = Math.max(width, height);
      cam.setViewOffset(width, height, c.shiftX * big, -c.shiftY * big, width, height);
    }
  } else {
    cam = new THREE.PerspectiveCamera(camera.fov, aspect, camera.near, camera.far);
    cam.position.copy(camera.position);
    cam.quaternion.copy(camera.quaternion);
  }
  cam.updateProjectionMatrix();
  cam.updateMatrixWorld();

  // World and lights
  const useFile = opts.lighting === 'file' && fileLights().length;
  const worldColor = new THREE.Color();
  const wc = state.blend?.scene?.world?.color;
  if (useFile && wc) worldColor.setRGB(wc[0], wc[1], wc[2], THREE.LinearSRGBColorSpace);
  else worldColor.set(0x2a2c30);

  let env;
  if (useFile) {
    env = gradientEnvironment(worldColor, worldColor);
  } else {
    env = gradientEnvironment(new THREE.Color(0.78, 0.82, 0.9), new THREE.Color(0.08, 0.07, 0.065));
    const key = new THREE.DirectionalLight(0xffffff, 2.4);
    const dir = new THREE.Vector3(-0.45, 0.55, -0.7).normalize();
    aimDirectional(key, dir, center, radius);
    scene.add(key, key.target);
    const rim = new THREE.DirectionalLight(0xcfe0ff, 0.7);
    aimDirectional(rim, new THREE.Vector3(0.6, -0.3, -0.5).normalize(), center, radius);
    rim.castShadow = false;
    scene.add(rim, rim.target);
  }
  disposables.push(env);
  scene.environment = env;
  scene.environmentIntensity = useFile ? 1 : 0.9;
  // Equirect maps are Y-up; Blender scenes are Z-up.
  scene.environmentRotation.set(Math.PI / 2, 0, 0);
  scene.backgroundRotation.set(Math.PI / 2, 0, 0);
  scene.background = opts.background === 'transparent' ? null : worldColor.clone();

  if (useFile) {
    for (const e of fileLights()) {
      const L = e.src.light;
      const m = new THREE.Matrix4().fromArray(e.src.matrix);
      const pos = new THREE.Vector3(), quat = new THREE.Quaternion(), scl = new THREE.Vector3();
      m.decompose(pos, quat, scl);
      const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(quat);
      const color = new THREE.Color().setRGB(L.color[0], L.color[1], L.color[2], THREE.LinearSRGBColorSpace);
      // Blender watts to three.js intensities, the same conversion the
      // Blender glTF exporter uses in its "compatibility" light mode.
      if (L.kind === 'sun') {
        const light = new THREE.DirectionalLight(color, L.energy);
        aimDirectional(light, dir, center, radius);
        scene.add(light, light.target);
      } else if (L.kind === 'spot') {
        const light = new THREE.SpotLight(color, L.energy / (4 * Math.PI), 0, Math.min(L.spotSize / 2, Math.PI / 2 - 0.01), L.spotBlend, 2);
        light.position.copy(pos);
        light.target.position.copy(pos).add(dir);
        light.castShadow = true;
        light.shadow.mapSize.set(1024, 1024);
        light.shadow.camera.near = Math.max(0.01, radius / 500);
        scene.add(light, light.target);
      } else if (L.kind === 'area') {
        const w = Math.max(1e-3, L.sizeX * scl.x), h = Math.max(1e-3, (L.areaShape === 'rectangle' || L.areaShape === 'ellipse' ? L.sizeY : L.sizeX) * scl.y);
        const light = new THREE.RectAreaLight(color, L.energy / (Math.PI * w * h), w, h);
        light.position.copy(pos);
        light.quaternion.copy(quat);
        scene.add(light);
      } else {
        const light = new THREE.PointLight(color, L.energy / (4 * Math.PI), 0, 2);
        light.position.copy(pos);
        light.castShadow = true;
        light.shadow.mapSize.set(1024, 1024);
        light.shadow.camera.near = Math.max(0.01, radius / 500);
        scene.add(light);
      }
    }
  }
  scene.updateMatrixWorld(true);
  return { scene, camera: cam, disposables };
}

function aimDirectional(light, dir, center, radius) {
  light.position.copy(center).addScaledVector(dir, -radius * 3);
  light.target.position.copy(center);
  light.castShadow = true;
  const s = light.shadow;
  s.mapSize.set(2048, 2048);
  s.camera.left = s.camera.bottom = -radius * 1.2;
  s.camera.right = s.camera.top = radius * 1.2;
  s.camera.near = radius * 0.5;
  s.camera.far = radius * 6;
  s.bias = -0.0004;
  s.normalBias = radius * 0.004;
}

const job = { active: false, stop: false, renderer: null, tracer: null, canvas: null, disposables: [], pmrem: null, name: 'render' };

function setRenderProgress(title, stats, fraction) {
  $('rvTitle').textContent = title;
  $('rvStats').textContent = stats;
  $('rvBar').style.width = `${Math.round(Math.min(1, fraction) * 100)}%`;
}
const clock = (ms) => `${Math.floor(ms / 60000)}:${String(Math.floor(ms / 1000) % 60).padStart(2, '0')}`;

let rectAreaReady = false;
async function startRender(opts) {
  if (job.active) return;
  const { width, height } = renderDimensions(opts);
  $('renderView').hidden = false;
  $('rvBody').innerHTML = '';
  $('rvSave').disabled = true;
  $('rvShare').disabled = true;
  $('rvStop').hidden = false;
  $('rvStop').disabled = false;
  setRenderProgress('Preparing scene…', `${width} × ${height}`, 0);
  job.active = true;
  job.stop = false;
  job.name = ($('fileName').textContent || 'render').replace(/\.[^.]+$/, '') + '-render.png';
  await nextFrame();

  try {
    const { scene: rs, camera: rc, disposables } = buildRenderScene(opts, width, height);
    job.disposables = disposables;
    const out = document.createElement('canvas');
    out.width = width;
    out.height = height;
    out.setAttribute('role', 'img');
    out.setAttribute('aria-label', 'Rendered image');
    $('rvBody').append(out);
    job.canvas = out;
    const r = new THREE.WebGLRenderer({ canvas: out, antialias: opts.engine === 'fast', alpha: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
    job.renderer = r;
    r.setPixelRatio(1);
    r.setSize(width, height, false);
    r.toneMapping = THREE.NeutralToneMapping;
    r.setClearColor(0x000000, 0);
    const t0 = performance.now();

    if (opts.engine === 'fast') {
      if (rs.children.some((o) => o.isRectAreaLight) && !rectAreaReady) {
        const { RectAreaLightUniformsLib } = await import('three/addons/lights/RectAreaLightUniformsLib.js');
        RectAreaLightUniformsLib.init();
        rectAreaReady = true;
      }
      r.shadowMap.enabled = true;
      r.shadowMap.type = THREE.PCFSoftShadowMap;
      job.pmrem = new THREE.PMREMGenerator(r);
      const envTarget = job.pmrem.fromEquirectangular(rs.environment);
      disposables.push(envTarget);
      rs.environment = envTarget.texture;
      r.render(rs, rc);
      finishRender(`Done in ${clock(performance.now() - t0)}`, `${width} × ${height} · fast`);
      return;
    }

    setRenderProgress('Loading path tracer…', `${width} × ${height}`, 0);
    await nextFrame();
    const { WebGLPathTracer } = await import('three-gpu-pathtracer');
    if (job.stop) { finishRender('Stopped', ''); return; }
    const pt = new WebGLPathTracer(r);
    job.tracer = pt;
    pt.renderDelay = 0;
    pt.minSamples = 0;
    pt.fadeDuration = 0;
    pt.rasterizeScene = false;
    pt.bounces = 6;
    pt.filterGlossyFactor = 0.5;
    // Tiles keep each frame short so phones stay responsive.
    const tiles = width * height > 1.2e6 ? 3 : 2;
    pt.tiles.set(tiles, tiles);
    setRenderProgress('Building BVH…', `${width} × ${height}`, 0);
    await nextFrame();
    pt.setScene(rs, rc);
    const target = opts.samples;
    const step = () => {
      if (job.stop || !job.active) {
        finishRender(`Stopped at ${Math.floor(pt.samples)} samples`, `${width} × ${height} · ${clock(performance.now() - t0)}`);
        return;
      }
      pt.renderSample();
      const done = Math.floor(pt.samples);
      setRenderProgress('Rendering…', `${done} / ${target} samples · ${clock(performance.now() - t0)}`, pt.samples / target);
      if (done > 0) $('rvSave').disabled = false;
      if (pt.samples >= target) {
        finishRender(`Done in ${clock(performance.now() - t0)}`, `${width} × ${height} · ${target} samples`);
        return;
      }
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  } catch (err) {
    console.error(err);
    finishRender('Render failed', '');
    $('rvBody').innerHTML = '';
    const p = document.createElement('p');
    p.className = 'note';
    p.textContent = /context|memory|allocate/i.test(String(err && err.message))
      ? 'This device ran out of graphics memory. Try a smaller size or the Fast engine.'
      : `Could not render: ${err && err.message ? err.message : err}`;
    $('rvBody').append(p);
  }
}

function finishRender(title, stats) {
  job.active = false;
  setRenderProgress(title, stats, 1);
  $('rvStop').hidden = true;
  $('rvSave').disabled = !job.canvas;
  shareSupport();
}

async function renderBlob() {
  return new Promise((res) => job.canvas.toBlob(res, 'image/png'));
}
async function shareSupport() {
  const btn = $('rvShare');
  btn.hidden = true;
  if (!job.canvas || !navigator.canShare) return;
  try {
    const probe = new File([new Blob()], job.name, { type: 'image/png' });
    if (navigator.canShare({ files: [probe] })) { btn.hidden = false; btn.disabled = false; }
  } catch { /* not supported */ }
}

$('rvStop').addEventListener('click', () => { job.stop = true; $('rvStop').disabled = true; });
$('rvSave').addEventListener('click', async () => {
  if (!job.canvas) return;
  const blob = await renderBlob();
  if (!blob) { toast('Could not create the image'); return; }
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement('a'), { href: url, download: job.name });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  toast(`Saved ${job.name}`);
});
$('rvShare').addEventListener('click', async () => {
  const blob = await renderBlob();
  if (!blob) return;
  try { await navigator.share({ files: [new File([blob], job.name, { type: 'image/png' })], title: job.name }); }
  catch (err) { if (err && err.name !== 'AbortError') toast('Sharing is not available here. Use Save PNG.'); }
});

function closeRenderView() {
  job.stop = true;
  job.active = false;
  try { job.tracer && job.tracer.dispose(); } catch { /* ignore */ }
  for (const d of job.disposables) d.dispose && d.dispose();
  if (job.pmrem) job.pmrem.dispose();
  if (job.renderer) { job.renderer.dispose(); job.renderer.forceContextLoss(); }
  Object.assign(job, { tracer: null, renderer: null, canvas: null, disposables: [], pmrem: null });
  $('rvBody').innerHTML = '';
  $('renderView').hidden = true;
  requestRender();
}
$('rvClose').addEventListener('click', closeRenderView);

// ---------------------------------------------------------------- start with the sample
function loadSample() {
  const bin = atob(SAMPLE_BASE64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  openBuffer(SAMPLE_NAME, bytes.buffer);
}
resize();
loadSample();
</script>
